name: PR13 live production tracer diagnostic
run-name: PR13 M3 bounded trace, unchanged production limits
'on':
  push:
    branches:
    - validation/pr13-m3-trace-probe-20260907
    paths:
    - .github/workflows/pr13-m3-trace.yml
    - .github/qualification/pr13-trace-probe.mjs
permissions:
  contents: read
concurrency:
  group: pr13-m3-trace-probe
  cancel-in-progress: false
jobs:
  trace:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 04ebc3b9273aa203fc00407c646338f4c5ef2236
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Provision pinned candidate toolchain without model credentials
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(npm --version)" = 11.19.0

        '
    - name: Prepare immutable read-only cancellation target
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 04ebc3b9273aa203fc00407c646338f4c5ef2236

        test "$(git rev-parse HEAD^{tree})" = 12d16f03ed54195d870e1c325f674061c48d197f

        printf ''PROBE_TARGET=%s/pr13-trace-target

        PROBE_HOME=%s/pr13-trace-home

        PROBE_EVIDENCE=%s/pr13-trace-evidence

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        git init -q "$RUNNER_TEMP/pr13-trace-target"

        git -C "$RUNNER_TEMP/pr13-trace-target" fetch --depth=1 https://github.com/anirudhsengar/hono.git e2740d5a1bd0b4254e517e3af8b60789284bc7bd

        git -C "$RUNNER_TEMP/pr13-trace-target" checkout -q --detach FETCH_HEAD

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: campaign-code
        persist-credentials: false
    - name: Run actual M3 tracer and retain safe timing and submission diagnostics
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
      run: node --import tsx campaign-code/.github/qualification/pr13-trace-probe.mjs
    - name: Retain bounded live tracer evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr13-m3-trace-${{ github.run_id }}
        path: ${{ env.PROBE_EVIDENCE }}
        if-no-files-found: warn
        retention-days: 14
    - name: Remove probe credentials and target
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/pr13-trace-home" "$RUNNER_TEMP/pr13-trace-target"
