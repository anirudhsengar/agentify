name: Open validated portfolio fix PR

on:
  push:
    branches: [fix/portfolio-closure-command-contracts]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: open-portfolio-closure-fix-pr
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event.head_commit.message == 'fix: close repository portfolios and validate commands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Remove one-shot workflow and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          rm -f .github/workflows/open-portfolio-fix-pr.yml
          git add -A
          git commit -m "ci: remove one-shot portfolio implementation workflow"
          git push origin HEAD:fix/portfolio-closure-command-contracts
          if ! gh pr view fix/portfolio-closure-command-contracts --repo anirudhsengar/agentify >/dev/null 2>&1; then
            gh pr create \
              --repo anirudhsengar/agentify \
              --base main \
              --head fix/portfolio-closure-command-contracts \
              --title "fix: enforce complete specialist portfolios and executable procedures" \
              --body-file - <<'BODY'
          ## Problem

          The Click qualification exposed three general defects after specialist evidence became Git-grounded:

          - semantic closure considered only paths already named by the model, so a complete source-and-test subsystem could be omitted without failing closure;
          - prose guidance from per-change validation metadata was persisted as executable procedure commands;
          - first-install bootstrap wrote full candidate and revision-one history duplicates, and placeholder audit questions survived closure.

          ## Changes

          - derive language-independent behavior clusters from the full tracked Git tree and require source/test cluster coverage or an explicit repository-specific rejection;
          - validate and retain only syntactically executable repository commands before specialist and procedure materialization;
          - compact accepted bootstrap state by omitting redundant revision-one mutation and candidate-decision snapshots while preserving later audit history;
          - remove placeholder discovery questions once semantic closure is reached;
          - add Click-shaped and generic multi-language regressions.

          ## Validation

          The implementation workflow ran typecheck, focused specialist/memory tests, and the complete source suite before committing these changes. The pull-request CI additionally runs both Node matrices, dependency audit, exact packed-package qualification, scaffold verification, and CodeQL.
          BODY
          fi
