name: PR13 current-candidate installed CLI cancellation
run-name: PR13 22dd670 installed CLI cancellation and request accounting
'on':
  push:
    branches:
    - validation/pr13-cli-cancel-r8-20260908
    paths:
    - .github/workflows/pr13-cli-cancel-r8.yml
    - .github/qualification/**
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-cli-cancel-r8-20260908
  cancel-in-progress: false
jobs:
  install:
    if: github.actor == github.repository_owner
    name: Actual installed CLI cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - name: pyjwt
          repository: anirudhsengar/pyjwt
          sha: 7144e4534c34810f4525dc4578a32addd8212cff
          cohort: heldout-round-1
    env:
      LIVE_REPOSITORY: ${{ matrix.case.repository }}
      LIVE_TARGET_SHA: ${{ matrix.case.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 22dd6704d9dfd3d23015c598d8a6a98d4771e72f
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Provision pinned candidate toolchain without model credentials
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(npm --version)" = 11.19.0

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: validation-code
        persist-credentials: false
    - name: Require successful exact-candidate qualification and its verified package hash
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_CANDIDATE: 22dd6704d9dfd3d23015c598d8a6a98d4771e72f
        EXPECTED_TREE: e5acf37f7829ed766c8d701578e38090788925e8
        EXPECTED_LAUNCHER: 842bc064dade3e3b2dfc858d41ee57a3098b277f
      run: "set -euo pipefail\numask 022\nmv -- validation-code \"$RUNNER_TEMP/review-r8-validation\"\ntest \"$(git\
        \ rev-parse HEAD)\" = 22dd6704d9dfd3d23015c598d8a6a98d4771e72f\ntest \"$(git rev-parse HEAD^{tree})\" =\
        \ e5acf37f7829ed766c8d701578e38090788925e8\ntest -z \"$(git status --porcelain)\"\ngh api repos/anirudhsengar/agentify/actions/runs/34224923921\
        \ > \"$RUNNER_TEMP/qualification.json\"\nfor version in 22.19.0 24.19.0; do\n gh run download 34224923921\
        \ -R anirudhsengar/agentify -n \"pr13-review-r8-node-$version-34224923921\" -D \"$RUNNER_TEMP/qualified-source/node-$version\"\
        \ndone\nfor name in r8-high-jwk r8-high-valid-cache r8-numeric-exp-canary; do\n gh run download 34224923921\
        \ -R anirudhsengar/agentify -n \"review-r8-$name-34224923921\" -D \"$RUNNER_TEMP/source-controls/$name\"\
        \ndone\nnode \"$RUNNER_TEMP/review-r8-validation/.github/qualification/verify-review-r8.mjs\"\nprintf 'LIVE_WORK_DIR=%s/fresh-pyjwt-r8-%s\\\
        nLIVE_PACK_RESULT=%s/pyjwt-r8-pack.json\\n' \"$RUNNER_TEMP\" \"$GITHUB_RUN_ID\" \"$RUNNER_TEMP\" >> \"$GITHUB_ENV\"\
        \n"
    - name: Pack exact qualified bytes
      run: 'set -euo pipefail

        umask 022

        npm run --silent pack:release > "$LIVE_PACK_RESULT"

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.env.LIVE_PACK_RESULT,"utf8"));
        assert.equal(p.sha256,process.env.LIVE_EXPECTED_PACKAGE_HASH); console.log(JSON.stringify(p));''

        '
    - name: Prepare fresh frozen target and install actual npm artifact
      run: npm run --silent live:prepare
    - name: Validate source-checkpoint observer without model credentials
      run: node --test "$RUNNER_TEMP/review-r8-validation/.github/qualification/cancellation-events.test.mjs"
    - name: Interrupt the actual installed CLI at the validated checkpoint
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: node "$RUNNER_TEMP/review-r8-validation/.github/qualification/cli-cancellation.mjs"
    - name: Retain redacted per-target evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cli-cancellation-r8-${{ github.run_id }}
        path: '${{ env.LIVE_WORK_DIR }}/evidence

          ${{ runner.temp }}/qualification.json

          ${{ runner.temp }}/review-r8-qualification-reuse.json'
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
    - name: Remove disposable target and credentials
      if: always()
      run: if test -n "${LIVE_WORK_DIR:-}"; then rm -rf -- "$LIVE_WORK_DIR"; fi
