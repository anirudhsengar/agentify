name: Export locality closure workspace

on:
  push:
    branches: [fix/locality-aware-semantic-closure]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Archive tracked workspace
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/agentify-locality-closure.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentify-locality-closure-workspace
          path: /tmp/agentify-locality-closure.tar.gz
          if-no-files-found: error
          retention-days: 1
