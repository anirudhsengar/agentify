name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run complete test suite
        id: test_all
        shell: bash
        run: |
          set +e
          npm run test:all > test-all.log 2>&1
          status=$?
          cat test-all.log
          if (( status != 0 )); then
            last_test=$(grep '^==>' test-all.log | tail -n 1 || true)
            {
              echo "exit_status=$status"
              echo "last_test=$last_test"
              echo
              tail -n 240 test-all.log
            } > test-all-failure.txt
          fi
          exit "$status"
      - name: Upload test failure diagnostics
        if: failure() && steps.test_all.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-all-failure-node-${{ matrix.node }}
          path: test-all-failure.txt
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  package-smoke:
    name: Packed package and scaffold smoke
    needs: [typecheck, tests, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run test:parity
      - run: npm run test:package
      - run: npm run verify:scaffold
