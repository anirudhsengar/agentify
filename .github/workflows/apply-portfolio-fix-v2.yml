name: Apply portfolio closure fix v2

on:
  push:
    branches: [fix/portfolio-closure-command-contracts]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-portfolio-closure-fix-v2
  cancel-in-progress: false

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply staged patch when implementation is absent
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          base=b5bdc72fb36feb17ddf94b4b568312411a77625f
          applied=false
          patch_file=""

          if grep -q 'uncovered_clusters' src/core/audit/specialist-completion.ts \
            && grep -Eq 'executable.*command|command.*executable' src/core/specialists/discovery.ts; then
            applied=true
          else
            while IFS= read -r candidate; do
              [[ -f "$candidate" ]] || continue
              case "$candidate" in
                .github/workflows/apply-portfolio-fix*.yml|.github/workflows/cleanup-portfolio-staging.yml|.github/workflows/open-portfolio-fix-pr.yml|.github/workflows/qualify-portfolio-fix.yml) continue ;;
              esac
              [[ $(stat -c %s "$candidate") -le 8000000 ]] || continue

              raw="$(mktemp)"
              if grep -q '^diff --git ' "$candidate" && git apply --check "$candidate"; then
                cp "$candidate" "$raw"
              elif base64 --decode "$candidate" > "$raw" 2>/dev/null \
                && grep -q '^diff --git ' "$raw" \
                && git apply --check "$raw"; then
                :
              else
                rm -f "$raw"
                continue
              fi

              git apply "$raw"
              rm -f "$raw"
              patch_file="$candidate"
              applied=true
              break
            done < <(git diff --name-only "$base"..HEAD)
          fi

          if [[ "$applied" != true ]]; then
            echo "No applied implementation and no valid staged patch were found" >&2
            exit 1
          fi
          echo "patch_file=$patch_file" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - name: Run Click-shaped and specialist regressions
        shell: bash
        run: |
          set -euo pipefail
          npx tsx tests/audit/specialist-completion.test.ts
          npx tsx tests/audit/tracked-specialist-closure.test.ts
          npx tsx tests/specialists/specialist-discovery.test.ts
          npx tsx tests/specialists/specialist-persistence.test.ts
          npx tsx tests/memory/memory-store.test.ts
      - run: npm run test:all
      - name: Remove staging artifacts and commit validated implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=b5bdc72fb36feb17ddf94b4b568312411a77625f
          rm -f \
            .github/workflows/apply-portfolio-fix.yml \
            .github/workflows/apply-portfolio-fix-v2.yml \
            .github/workflows/cleanup-portfolio-staging.yml \
            .github/workflows/open-portfolio-fix-pr.yml \
            .github/workflows/qualify-portfolio-fix.yml

          while IFS= read -r candidate; do
            [[ -f "$candidate" ]] || continue
            [[ $(stat -c %s "$candidate") -le 8000000 ]] || continue
            if grep -q '^diff --git ' "$candidate"; then
              rm -f "$candidate"
              continue
            fi
            decoded="$(mktemp)"
            if base64 --decode "$candidate" > "$decoded" 2>/dev/null && grep -q '^diff --git ' "$decoded"; then
              rm -f "$candidate"
            fi
            rm -f "$decoded"
          done < <(git diff --name-only "$base"..HEAD)

          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^src/\|^tests/'; then
            message='fix: close repository portfolios and validate commands'
          else
            message='ci: remove portfolio implementation staging'
          fi
          git commit -m "$message"
          git push origin HEAD:fix/portfolio-closure-command-contracts
          gh pr comment 5 --repo anirudhsengar/agentify --body "Applied the repository-cluster, executable-command, placeholder-cleanup, and bootstrap-compaction implementation. Typecheck, focused regressions, and the complete source suite passed before this commit."
