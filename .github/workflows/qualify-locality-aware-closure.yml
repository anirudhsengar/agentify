name: Qualify locality-aware semantic closure

on:
  push:
    branches: [fix/locality-aware-semantic-closure]

permissions:
  contents: write

concurrency:
  group: qualify-locality-aware-semantic-closure
  cancel-in-progress: false

jobs:
  apply-qualify-push:
    if: github.event.head_commit.message == 'ci: qualify locality-aware closure candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply or finish implementation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/implementation/apply-locality-aware-closure.py ]]; then
            python .github/implementation/apply-locality-aware-closure.py
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/runs/repository-audit-run.ts')
          text = path.read_text()
          old = '''      log.runEnd({
                exit_code: -1,
                status: "error",
                error_message: error instanceof Error ? error.message : String(error),
                coverage: coverage === null ? undefined : {
                  covered: coverage.closed.length,
                  gap: coverage.unresolved.length,
                  total: coverage.closed.length + coverage.unresolved.length,
                },
                agents_md_path: null,
              });'''
          new = '''      log.runEnd({
                exit_code: -1,
                status: "error",
                error_message: error instanceof Error ? error.message : String(error),
                ...(coverage === null ? {} : {
                  coverage: {
                    covered: coverage.closed.length,
                    gap: coverage.unresolved.length,
                    total: coverage.closed.length + coverage.unresolved.length,
                  },
                }),
                agents_md_path: null,
              });'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'coverage: coverage === null ? undefined' in text:
              raise SystemExit('unexpected run-end formatting')
          PY
          rm -f \
            .github/implementation/apply-locality-aware-closure.py \
            .github/workflows/apply-locality-aware-closure.yml \
            .github/workflows/export-locality-closure-workspace.yml \
            .github/workflows/qualify-locality-aware-closure.yml
          rmdir .github/implementation 2>/dev/null || true
          git diff --check
      - name: Commit exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make semantic closure locality aware"
      - run: npm ci
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx --test \
            tests/audit/locality-aware-semantic-closure.test.ts \
            tests/audit/repository-cluster-closure.test.ts \
            tests/audit/tracked-specialist-closure.test.ts
      - name: Run complete release qualification
        run: npm run verify:release
      - name: Push validated candidate
        run: git push origin HEAD:fix/locality-aware-semantic-closure
