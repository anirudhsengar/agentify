name: PR13 literal-source review presentation
run-name: PR13 literal immutable source, unchanged complete review gates
'on':
  push:
    branches:
    - validation/pr13-readable-review-r10-20260908
    paths:
    - .github/workflows/pr13-readable-review-r10.yml
    - .github/qualification/**
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-readable-review-r10-20260908
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == github.repository_owner
    name: Review / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - artifact: native-live-pyjwt-34196528837
          source_run: 34196528837
          map_sha256: ef196b102ee2e11935de68bbb776791bb8f0e7a895149b27955d8d10bf7489cd
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          name: r10-high-jwk
          concern: JWK and JWKSet parsing
          candidate_sha: 9afdac0a1aa038b07bdd2fad5c01944d7714268f
          candidate_tree: ae4f144836aacb62ed52ac182f32520ad8a72650
          thinking_level: high
          known_bad_fragment: reports as expired
          require_source_precheck: true
        - artifact: native-live-pyjwt-34196528837
          source_run: 34196528837
          map_sha256: ef196b102ee2e11935de68bbb776791bb8f0e7a895149b27955d8d10bf7489cd
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          name: r10-high-valid-cache
          concern: JWK and JWKSet parsing
          candidate_sha: 9afdac0a1aa038b07bdd2fad5c01944d7714268f
          candidate_tree: ae4f144836aacb62ed52ac182f32520ad8a72650
          positive_control: true
          thinking_level: high
        - artifact: native-live-pyjwt-34196528837
          source_run: 34196528837
          map_sha256: ef196b102ee2e11935de68bbb776791bb8f0e7a895149b27955d8d10bf7489cd
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          name: r10-numeric-exp-canary
          concern: JWT claim validation and payload lifecycle
          candidate_sha: 9afdac0a1aa038b07bdd2fad5c01944d7714268f
          candidate_tree: ae4f144836aacb62ed52ac182f32520ad8a72650
          thinking_level: high
          false_claim_canary: true
          require_source_precheck: true
          require_source_excerpt: true
    steps:
    - name: Require existing exact-code success before model use
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api repos/anirudhsengar/agentify/actions/runs/34232435252 --jq ''.status + " " + .conclusion + " " +
        .head_sha'' > "$RUNNER_TEMP/prior-qualification-status"

        test "$(cat "$RUNNER_TEMP/prior-qualification-status")" = ''completed success 881e103fa18dc362c2a074b6a679300be7884ebf''

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 9afdac0a1aa038b07bdd2fad5c01944d7714268f
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Install pinned test toolchain, no model credentials
      run: 'npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(git rev-parse HEAD)" = 9afdac0a1aa038b07bdd2fad5c01944d7714268f

        test "$(git rev-parse HEAD^{tree})" = ae4f144836aacb62ed52ac182f32520ad8a72650

        '
    - name: Fetch exact retained input and immutable repository
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: 'set -euo pipefail

        printf ''PROBE_TARGET=%s/probe-target

        PROBE_PREVIOUS=%s/previous

        PROBE_EVIDENCE=%s/evidence

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''HOME=%s/probe-home

        USERPROFILE=%s/probe-home

        XDG_CONFIG_HOME=%s/probe-home/.config

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        name=$(printf ''%s'' "$REVIEW_CASE" | jq -r .artifact)

        repository=$(printf ''%s'' "$REVIEW_CASE" | jq -r .repository)

        sha=$(printf ''%s'' "$REVIEW_CASE" | jq -r .target_sha)

        gh run download 34196528837 -R anirudhsengar/agentify -n "$name" -D "$RUNNER_TEMP/previous"

        git init -q "$RUNNER_TEMP/probe-target"

        git -C "$RUNNER_TEMP/probe-target" fetch --depth=1 "https://github.com/$repository.git" "$sha"

        git -C "$RUNNER_TEMP/probe-target" checkout --detach -q FETCH_HEAD

        mkdir -p "$RUNNER_TEMP/probe-home"

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: probe-code
        persist-credentials: false
    - name: Validate source presentation without model credentials
      run: node --test probe-code/.github/qualification/readable-evidence.test.mjs
    - name: Run bounded production review with explicit verdicts
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: node --import tsx probe-code/.github/qualification/review-probe.mjs
    - name: Retain redacted review outcome only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: readable-r10-${{ matrix.case.name }}-${{ github.run_id }}
        path: ${{ env.PROBE_EVIDENCE }}
        if-no-files-found: warn
        retention-days: 14
    - name: Remove disposable inputs and authentication
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/probe-home" "$RUNNER_TEMP/probe-target" "$RUNNER_TEMP/previous"
    permissions:
      contents: read
      actions: read
