name: Apply implementation

on:
  push:
    branches: [fix/portfolio-closure-command-contracts]
    paths:
      - .github/workflows/apply-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        env:
          PATCH_ZB64: >-
            
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib
          import zlib

          payload = ''.join(os.environ['PATCH_ZB64'].split())
          patch = zlib.decompress(base64.b64decode(payload))
          pathlib.Path('/tmp/agentify-implementation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/agentify-implementation.patch
          git apply /tmp/agentify-implementation.patch
          rm -rf .github/agentify-patch-parts
          rm -f .github/workflows/apply-implementation.yml
          git config user.name "Agentify implementation"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git commit -m "fix: close repository specialists and command contracts"
          git push origin HEAD:fix/portfolio-closure-command-contracts
