name: Materialize locality-aware closure

on:
  push:
    branches: [fix/materialize-locality-closure]

permissions:
  contents: write

concurrency:
  group: materialize-locality-aware-closure
  cancel-in-progress: false

jobs:
  materialize-qualify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/materialize-locality-closure
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Materialize a staging-free source candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/implementation/materialize-corrective-v4.py
          rm -rf .github/implementation
          rm -f \
            .github/materialization-trigger \
            .github/workflows/apply-locality-aware-closure.yml \
            .github/workflows/apply-locality-closure-fix-v2.yml \
            .github/workflows/apply-locality-closure-fix.yml \
            .github/workflows/export-locality-closure-workspace.yml \
            .github/workflows/qualify-locality-aware-closure.yml \
            .github/workflows/materialize-locality-closure.yml
          git diff --check
      - name: Commit the exact candidate before qualification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: materialize locality-aware semantic closure"
      - run: npm ci
      - name: Run focused corrective regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx --test \
            tests/audit/locality-aware-semantic-closure.test.ts \
            tests/audit/repository-cluster-closure.test.ts \
            tests/audit/tracked-specialist-closure.test.ts \
            tests/audit/specialist-completion.test.ts \
            tests/release-safety.test.ts
          node --test tests/implementation-diff-gate.test.mjs
      - name: Run complete release qualification
        run: npm run verify:release
      - name: Restore branch workflows after qualification and push non-workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/fix/materialize-locality-closure -- .github/workflows
          git add .github/workflows
          git commit --amend --no-edit
          git diff --quiet origin/fix/materialize-locality-closure -- .github/workflows
          git diff --check origin/fix/materialize-locality-closure...HEAD
          git push origin HEAD:fix/materialize-locality-closure
