name: PR13 verified explorer completion source staging
on:
  push:
    branches: [codex/pr13-release-qualification]
    paths: [.github/workflows/pr13-repair-source.yml]
permissions:
  contents: read
jobs:
  stage:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7da55f6c0e125532a3ed4baad5417129632a70c8
          persist-credentials: false
      - name: Verify and store only immutable ordinary source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/anirudhsengar/agentify/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git('rev-parse', 'HEAD') == '7da55f6c0e125532a3ed4baad5417129632a70c8'
          with urllib.request.urlopen(urllib.request.Request(api + '/30f05dc19e6ac2d197a45425da1a28c07425effd', headers=headers), timeout=30) as response:
              stored = json.load(response)
          assert stored['encoding'] == 'base64'
          patch = base64.b64decode(stored['content'])
          assert blob_sha(patch) == '30f05dc19e6ac2d197a45425da1a28c07425effd'
          assert hashlib.sha256(patch).hexdigest() == '12d53141216be477ba2d269208786686f643b5932db014091d7fbbbcc708930f'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          tree = git('write-tree')
          assert tree == '11d5ff6c71c3aecf016d23d767933b4d72d7c4c1', tree
          expected = {'CHANGELOG.md': 'a8f3d54e35381e5215199b76afd0a0bf3f21ed20', 'docs/architecture/install-once-repository-team.md': '968810652cec5da1001258312844c3418dd5c78a', 'src/core/audit/spawn-explorer-tool.ts': '54b30a51c11dd9a04680fe24c3a2bd329f9e9eec', 'tests/audit/explorer-provider-failure-sdk.test.ts': '3f0f2d593bf20d836680d998be6b23fcfafba043'}
          assert sorted(git('diff', '--cached', '--name-only').splitlines()) == sorted(expected)
          for name, sha in expected.items():
              assert not name.startswith('.github/')
              file = pathlib.Path(name)
              assert file.is_file() and not file.is_symlink()
              data = file.read_bytes()
              assert blob_sha(data) == sha, name
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              with urllib.request.urlopen(urllib.request.Request(api, data=body, headers=headers, method='POST'), timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              print(name, sha)
          print('Verified source tree:', tree)
          print('No model, dependency script, commit or ref update was executed.')
          PY
