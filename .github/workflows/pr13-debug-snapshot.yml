name: Temporary PR13 integrated-source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-integrated' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8f5c956b39809c008d7cf53b8b740df49358eafa
          persist-credentials: false
      # Preserve newer source changes; stage only the two overlapping files.
      # No model, repository/dependency scripts, commits or ref updates.
      - name: Stage only exact locally verified integrated blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          runtime = pathlib.Path("src/core/pi-sdk-runtime.ts")
          text = runtime.read_text()
          needle = 'import { AuditCheckpointCadence } from "./audit/checkpoint-cadence.ts";'
          assert text.count(needle) == 1
          text = text.replace(needle, needle + '\nimport { withInitialScoutCheckpoint } from "./audit/initial-scout-checkpoint.ts";')
          needle = '    const resourceLoader = new DefaultResourceLoader({'
          assert text.count(needle) == 1
          text = text.replace(needle, '''    const initialScout = customTools.find(tool => tool.name === "spawn_explorer");
              if (checkpointCadence && options.spawnExplorerStateDir && options.spawnExplorerAgentDir
                && options.onEvent && initialScout) {
                customTools.splice(0, customTools.length, ...withInitialScoutCheckpoint(customTools, {
                  stateDir: options.spawnExplorerStateDir,
                  scout: initialScout,
                  onEvent: options.onEvent,
                }));
              }
          
          ''' + needle)
          runtime.write_text(text)
          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text()
          needle = '## [Unreleased]\n'
          assert text.count(needle) == 1
          text = text.replace(needle, needle + '\n- Dispatch the mandatory initial scout after a validated topography checkpoint instead of depending on the parent model to choose discovery. Preserve the selected model, shared budgets, actual source receipts, and all installation gates.\n', 1)
          changelog.write_text(text)
          expected = {'CHANGELOG.md': '6deedb4dc1fbe765a23f8c4349c8d78de1996860', 'src/core/pi-sdk-runtime.ts': 'c54357774861e2355d3330064234d69b796c07d6'}
          for name, sha in expected.items():
              content = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() == sha
              req = urllib.request.Request("https://api.github.com/repos/anirudhsengar/agentify/git/blobs",
                  data=json.dumps({"content": base64.b64encode(content).decode(), "encoding": "base64"}).encode(),
                  method="POST", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  assert json.load(response)["sha"] == sha
          print(json.dumps({"verified_blobs": expected, "refs_updated": False}))
          PY
