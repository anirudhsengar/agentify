name: Temporary PR13 verified tracer source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-tracer-terminal' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ece3fd016884214b7cf19383e052ee806d9e4a2c
          persist-credentials: false
      - name: Verify and store only fixed ordinary source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/anirudhsengar/agentify/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == 'ece3fd016884214b7cf19383e052ee806d9e4a2c'
          with urllib.request.urlopen(urllib.request.Request(api + '/1ffa34bc2a495a8d0a5d1bf26ae1ef241b775238', headers=headers), timeout=30) as response:
              blob = json.load(response)
          data = base64.b64decode(blob['content'])
          def blob_sha(value):
              return hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
          assert blob_sha(data) == '1ffa34bc2a495a8d0a5d1bf26ae1ef241b775238'
          encoded = base64.b64encode(data).decode()
          assert encoded.count('MPR+e5PD4') == 1
          encoded = encoded.replace('MPR+e5PD4', 'MPR+5PD4')
          compressed = base64.b64decode(encoded + '=' * (-len(encoded) % 4))
          assert blob_sha(compressed) == '0b57b3347c4aa1027e8f15a0bdbce6b955669550'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '82e782e4d458062176fd16249445ed3aee78be969712be6ffbc9271d7b3952ce'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '0c9b57b1f53b93e4949ef5d5fd52e8dede225101', tree
          expected = {'CHANGELOG.md': '8af92883520e33c71a328efce18b50546f8de541', 'docs/architecture/install-once-repository-team.md': 'd708c71927142f93ef2e26cdc8cca8b4b3459458', 'src/core/audit/prompts/explorers/concern_tracer.md': '6c8fa431c02970773a6d63a015904a19262e340b', 'src/core/audit/spawn-explorer-tool.ts': '19bb580966f4f0dd27c91e87d55c556277fd7903', 'tests/audit/tracer-terminal-sdk.test.ts': '0d2812edc6835a419f54a4d42ec04f8c71720e4a'}
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(expected)
          for name, sha in expected.items():
              assert not name.startswith('.github/')
              data = pathlib.Path(name).read_bytes()
              assert blob_sha(data) == sha, name
              request = urllib.request.Request(api, data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              print(name, sha)
          print('Verified source tree:', tree)
          print('No commit or ref was changed by this job.')
          PY
