name: Temporary PR13 verified source recovery
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  recover:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-source-export' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8e32c6b98772c667c9d267a4a16119e0216889f6
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source with verified staged corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr13-sources'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args])
          (out / 'current.tar').write_bytes(git('archive', '--format=tar', 'HEAD'))
          (out / 'current-tree.txt').write_bytes(git('ls-tree', '-r', 'HEAD'))
          subprocess.run(['git', 'checkout', '--detach', 'e15b4590adc18f8d33bac27d71d83f25b5b17d4c'], check=True)
          expected = {'CHANGELOG.md': '243e7d23c6bc33df221e79f9d2e88ee6d199173e', 'docs/architecture/install-once-repository-team.md': 'b28b1f23c4ff4eb7181ddf62189ada3c13ee9cca', 'src/core/audit/checkpoint-cadence.ts': '9caf0afec5ec08caabd307ec634f8374e705cec1', 'src/core/audit/log.ts': '14fca89413d2325a5fee7c4699e816056be03963', 'src/core/pi-sdk-runtime.ts': 'c6112ed958225b0bb6fdd3d04230782b2b31eed3', 'tests/audit/checkpoint-cadence.test.ts': 'a7467197e9b155094ecb272941c964f7d7cdd7ea', 'tests/audit/checkpoint-enforcement-sdk.test.ts': 'ae8c78e272be08b9ae6a52c8f88400a8b1e1f81d', 'tests/audit/log.test.ts': '071f32f0758b3f37e54884fe5e0f75b7987c1e98'}
          for name, sha in expected.items():
              request = urllib.request.Request(f'https://api.github.com/repos/anirudhsengar/agentify/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          tree = git('write-tree').decode().strip()
          assert tree == 'a2e7d1f554f5a58bca8dddd7023fc4612398f947', tree
          (out / 'staged.tar').write_bytes(git('archive', '--format=tar', tree))
          (out / 'staged-tree.txt').write_bytes(git('ls-tree', '-r', tree))
          (out / 'staged.patch').write_bytes(git('diff', '--cached', '--binary', 'HEAD'))
          (out / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(out.iterdir())))
          print('Verified staged tree:', tree)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr13-recovered-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/pr13-sources
          if-no-files-found: error
          retention-days: 1
