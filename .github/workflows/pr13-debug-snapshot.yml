name: Temporary PR13 Windows boundary source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-windows-source' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 199f4e3a834a0e693d514e8b3ca864795529ed57
          persist-credentials: false
      - name: Stage only verified ordinary source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, re, subprocess, urllib.request, urllib.error
          url = 'https://raw.githubusercontent.com/anirudhsengar/agentify/07f2c979ee3cc1f73085e1d0ba31327b7267eaf4/.github/workflows/pr13-debug-snapshot.yml'
          with urllib.request.urlopen(url, timeout=30) as response:
              original = response.read()
          assert hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest() == '9cb47532cca2eb0bd27ce3cdfd6534fce4e8fa93'
          encoded = re.search(r"encoded = '([^']+)'", original.decode()).group(1).replace('4RSIDCel+', '4RSIDKel+')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e5b6d76e8409c7203ad66a86d0a1ef8d142dce8096d403571e03b4377955acc0'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '03be124288948c59442656a2022b32991657e9f8'
          expected = {'CHANGELOG.md': '3c748c85b08c2258edf70ab031eab4cdc7a6f7c3', 'SECURITY.md': '6c38587c480d8de42a03aa3a8c2a057441bb143d', 'src/core/task-lifecycle/validation-runner.ts': '9f6edded810effc38c27fb688901aa59263b231b', 'tests/installer/windows-cmd-wrapper.test.ts': '09cc3199042c81c2ecaf4a416d147e2e6dbfb54f'}
          for name, sha in expected.items():
              assert not name.startswith('.github/')
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              req = urllib.request.Request('https://api.github.com/repos/anirudhsengar/agentify/git/blobs', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  print('GitHub rejected source staging:', error.code, error.read(2000).decode())
                  raise
              assert result['sha'] == sha
              print(name, sha)
          print('Ordinary source blobs verified; no workflow, commit or ref was written.')
          PY
