name: Temporary PR13 checkpoint-source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-checkpoint' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e15b4590adc18f8d33bac27d71d83f25b5b17d4c
          persist-credentials: false
      - name: Stage only hash-verified source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, re, subprocess, urllib.request
          expected_tree = 'a2e7d1f554f5a58bca8dddd7023fc4612398f947'
          expected_blobs = {'CHANGELOG.md': '243e7d23c6bc33df221e79f9d2e88ee6d199173e', 'docs/architecture/install-once-repository-team.md': 'b28b1f23c4ff4eb7181ddf62189ada3c13ee9cca', 'src/core/audit/checkpoint-cadence.ts': '9caf0afec5ec08caabd307ec634f8374e705cec1', 'src/core/audit/log.ts': '14fca89413d2325a5fee7c4699e816056be03963', 'src/core/pi-sdk-runtime.ts': 'c6112ed958225b0bb6fdd3d04230782b2b31eed3', 'tests/audit/checkpoint-cadence.test.ts': 'a7467197e9b155094ecb272941c964f7d7cdd7ea', 'tests/audit/checkpoint-enforcement-sdk.test.ts': 'ae8c78e272be08b9ae6a52c8f88400a8b1e1f81d', 'tests/audit/log.test.ts': '071f32f0758b3f37e54884fe5e0f75b7987c1e98'}
          def api(endpoint, data=None):
              req = urllib.request.Request('https://api.github.com/repos/anirudhsengar/agentify' + endpoint,
                  data=None if data is None else json.dumps(data).encode(),
                  method='GET' if data is None else 'POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          # The earlier immutable workflow is data only and is never executed.
          source = api('/contents/.github/workflows/pr13-debug-snapshot.yml?ref=03d4d282e7c623b1ffdafa73d6030c2d0765294a')
          assert source['sha'] == '4206b964e9de62de4e63d3805fad3bb725b8c9ef'
          encoded = re.findall(r"base64\.b64decode\('([A-Za-z0-9+/=]+)'\)", base64.b64decode(source['content']).decode())
          assert len(encoded) == 1
          assert encoded[0].count('DR2h64zGkzG4s34') == 1
          corrected = encoded[0].replace('DR2h64zGkzG4s34', 'DR2h64zGkz7s34')
          patch = gzip.decompress(base64.b64decode(corrected, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2a64d07a52af3f1a7148a6d191d78b3143faa0f8329bf445187d33b6b326f172'
          patch_file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          subprocess.run(['git', 'add', '--', *expected_blobs], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected_tree
          entries = []
          for name, sha in expected_blobs.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              content = path.read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
              assert api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})['sha'] == sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          assert api('/git/trees', {'base_tree': '06f6508ea432094d8b9fd88920671f8c14cd5424', 'tree': entries})['sha'] == expected_tree
          print(json.dumps({'tree': expected_tree, 'blobs': expected_blobs, 'refs_updated': False}))
          PY
