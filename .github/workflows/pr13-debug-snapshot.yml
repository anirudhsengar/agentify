name: Temporary PR13 Windows boundary source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-windows' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 199f4e3a834a0e693d514e8b3ca864795529ed57
          persist-credentials: false
      - name: Stage only verified source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          encoded = ''
          encoded = encoded.replace('4RSIDCel+', '4RSIDKel+')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e5b6d76e8409c7203ad66a86d0a1ef8d142dce8096d403571e03b4377955acc0'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          expected = {'.github/workflows/ci.yml': 'b2ea81c6864b54e9a10be182c7903d8335021ad1', 'CHANGELOG.md': '3c748c85b08c2258edf70ab031eab4cdc7a6f7c3', 'SECURITY.md': '6c38587c480d8de42a03aa3a8c2a057441bb143d', 'src/core/task-lifecycle/validation-runner.ts': '9f6edded810effc38c27fb688901aa59263b231b', 'tests/installer/windows-cmd-wrapper.test.ts': '09cc3199042c81c2ecaf4a416d147e2e6dbfb54f'}
          tree_sha = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree_sha == '03be124288948c59442656a2022b32991657e9f8', tree_sha
          def post(endpoint, payload):
              req = urllib.request.Request('https://api.github.com/repos/anirudhsengar/agentify/git/' + endpoint, data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              blob = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert blob['sha'] == sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          result = post('trees', {'base_tree': 'a2e7d1f554f5a58bca8dddd7023fc4612398f947', 'tree': entries})
          assert result['sha'] == tree_sha
          print('Verified source tree:', tree_sha)
          PY
