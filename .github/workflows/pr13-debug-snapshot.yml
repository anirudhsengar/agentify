name: Temporary PR13 tested-source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-patch' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 23a04fcc1d619fb075e7407d113ea4a340f454ff
          persist-credentials: false
      # Apply only the fixed, locally tested patch and verify every resulting
      # Git blob and tree. No repository/dependency scripts or model are run.
      # Stage objects only: this job never creates a commit or updates a ref.
      - name: Stage verified source objects without publishing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          expected_tree = '77608ea059788d6fd8fae4fa3b57dca63750d37d'
          expected_blobs = {'CHANGELOG.md': 'c3ac388002a2b5a7d7cf4ed7dfef824db0e18888', 'docs/architecture/install-once-repository-team.md': 'e4cddce7d80fcc121a14614de2db58fd394afdd1', 'src/core/audit/initial-scout-checkpoint.ts': 'c75fe1871783583078bcc3351566a0bc211b46d8', 'src/core/audit/prompts/builder.md': '60f436cbd23bef04e23faffb4e6ccaabf5f03229', 'src/core/pi-sdk-runtime.ts': '6021f6a8f3fd638dbf2a9add681efe4361a3bc71', 'tests/audit/initial-scout-checkpoint.test.ts': 'be9f783bb84ea66970fd605d528c0cfffee5c940', 'tests/audit/initial-scout-sdk.test.ts': '7f6e04aeb14334c0631b02e49b33364046296ede'}
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '88ee083947314fca7917fee72cf642180c82be9c3ec3deaeb07883324be9315e'
          patch_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "reviewed.patch"
          patch_file.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(patch_file)], check=True)
          subprocess.run(["git", "apply", str(patch_file)], check=True)
          subprocess.run(["git", "add", "--", *expected_blobs], check=True)
          assert subprocess.check_output(["git", "write-tree"], text=True).strip() == expected_tree
          repo = "anirudhsengar/agentify"
          def post(endpoint, data):
              req = urllib.request.Request("https://api.github.com/repos/" + repo + endpoint,
                  data=json.dumps(data).encode(), method="POST", headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries = []
          for name, sha in expected_blobs.items():
              path = pathlib.Path(name)
              assert not path.is_symlink() and path.is_file()
              content = path.read_bytes()
              assert hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() == sha
              result = post("/git/blobs", {"content": base64.b64encode(content).decode(), "encoding": "base64"})
              assert result["sha"] == sha
              entries.append({"path": name, "type": "blob", "mode": "100644", "sha": sha})
          result = post("/git/trees", {"base_tree": "4d9731570c1d5b03e4dc0c027164a48f2726f1b0", "tree": entries})
          assert result["sha"] == expected_tree
          print(json.dumps({"tree": expected_tree, "blobs": expected_blobs, "refs_updated": False}))
          PY
