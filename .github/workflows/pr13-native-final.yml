name: PR13 final native-selection code qualification
run-name: PR13 b8220ce exact code qualification, no repeated model probes
'on':
  push:
    branches:
    - validation/pr13-native-final-20260908
    paths:
    - .github/workflows/pr13-native-final.yml
permissions:
  contents: read
concurrency:
  group: pr13-native-final-20260908
  cancel-in-progress: false
jobs:
  qualify:
    if: github.actor == github.repository_owner
    name: Exact b8220ce qualification (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.19.0
        - 24.19.0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: b8220ce897ab05a0d3cb6947906846f9e18af472
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    - name: Provision SDK search tools
      run: 'sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        '
    - name: Install the pinned toolchain without model credentials
      run: 'npm install --global npm@11.19.0

        test "$(npm --version)" = "11.19.0"

        npm ci

        '
    - name: Verify immutable source and qualify the exact candidate
      shell: bash
      env:
        EXPECTED_NODE: ${{ matrix.node }}
      run: "set -euo pipefail\numask 022\ntest \"$(git rev-parse HEAD)\" = b8220ce897ab05a0d3cb6947906846f9e18af472\n\
        test \"$(git rev-parse HEAD^{tree})\" = bcc1850e6f669a76f340d122cab7da58f7015bb6\ntest \"$(node --version)\"\
        \ = \"v$EXPECTED_NODE\"\ntest \"$(npm --version)\" = \"11.19.0\"\ntest -z \"$(git status --porcelain)\"\n\
        {\n  git show -s --format='candidate=%H%ntree=%T'\n  node --version\n  npm --version\n  printf 'umask=';\
        \ umask\n} > \"$RUNNER_TEMP/pr13-native-final-environment.txt\"\nset +e\nnpm run verify:release > \"$RUNNER_TEMP/pr13-native-final-qualification.log\"\
        \ 2>&1\nstatus=$?\nif test \"$status\" = 0 && test \"$EXPECTED_NODE\" = \"22.19.0\"; then\n  npm run verify:pack-reproducibility\
        \ >> \"$RUNNER_TEMP/pr13-native-final-qualification.log\" 2>&1\n  status=$?\nfi\nprintf '%s\\n' \"$status\"\
        \ > \"$RUNNER_TEMP/pr13-native-final-qualification.exit\"\ncat \"$RUNNER_TEMP/pr13-native-final-qualification.log\"\
        \nexit \"$status\"\n"
    - name: Retain exact-candidate evidence even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr13-native-final-node-${{ matrix.node }}-${{ github.run_id }}
        path: '${{ runner.temp }}/pr13-native-final-environment.txt

          ${{ runner.temp }}/pr13-native-final-qualification.log

          ${{ runner.temp }}/pr13-native-final-qualification.exit

          '
        if-no-files-found: warn
        retention-days: 14
