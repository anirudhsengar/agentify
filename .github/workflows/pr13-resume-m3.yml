name: PR13 resumed MiniMax qualification
run-name: PR13 529c937 provider recovery, canary, fresh installations
'on':
  push:
    branches:
    - validation/pr13-resume-529-20260907
    paths:
    - .github/workflows/pr13-resume-m3.yml
    - .github/qualification/review-probe.mjs
    - .github/qualification/cancel-probe.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-resume-529-m3
  cancel-in-progress: false
jobs:
  canary:
    if: github.actor == github.repository_owner
    name: Review / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - name: pyjwt-numeric-exp-canary
          artifact: pr13-cd24-heldout-round-1-pyjwt-34101652351
          map_sha256: 2bbed000f4b8fb433f2bc74d1cedcfc4cb81e84739ed2317c9d5642b18f11c89
          concern: JWT registered claim validation
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          false_claim_canary: true
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 529c937d46e7ae45876a22f52bd4a820ccd0deab
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Install pinned test toolchain, no model credentials
      run: 'npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(git rev-parse HEAD)" = 529c937d46e7ae45876a22f52bd4a820ccd0deab

        test "$(git rev-parse HEAD^{tree})" = bfb1fe7c611832297ce3152b7ff46a50823d6730

        '
    - name: Fetch exact retained input and immutable repository
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: 'set -euo pipefail

        printf ''PROBE_TARGET=%s/probe-target

        PROBE_PREVIOUS=%s/previous

        PROBE_EVIDENCE=%s/evidence

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''HOME=%s/probe-home

        USERPROFILE=%s/probe-home

        XDG_CONFIG_HOME=%s/probe-home/.config

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        name=$(printf ''%s'' "$REVIEW_CASE" | jq -r .artifact)

        repository=$(printf ''%s'' "$REVIEW_CASE" | jq -r .repository)

        sha=$(printf ''%s'' "$REVIEW_CASE" | jq -r .target_sha)

        gh run download 34101652351 -R anirudhsengar/agentify -n "$name" -D "$RUNNER_TEMP/previous"

        git init -q "$RUNNER_TEMP/probe-target"

        git -C "$RUNNER_TEMP/probe-target" fetch --depth=1 "https://github.com/$repository.git" "$sha"

        git -C "$RUNNER_TEMP/probe-target" checkout --detach -q FETCH_HEAD

        mkdir -p "$RUNNER_TEMP/probe-home"

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: probe-code
        persist-credentials: false
    - name: Run bounded production review with explicit verdicts
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: node --import tsx probe-code/.github/qualification/review-probe.mjs
    - name: Retain redacted review outcome only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: resume-529-canary-${{ github.run_id }}
        path: ${{ env.PROBE_EVIDENCE }}
        if-no-files-found: warn
        retention-days: 14
    - name: Remove disposable inputs and authentication
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/probe-home" "$RUNNER_TEMP/probe-target" "$RUNNER_TEMP/previous"
  install:
    if: github.actor == github.repository_owner
    name: ${{ matrix.case.cohort }} / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case:
        - name: hono
          repository: anirudhsengar/hono
          sha: e2740d5a1bd0b4254e517e3af8b60789284bc7bd
          cohort: historical
        - name: pyjwt
          repository: anirudhsengar/pyjwt
          sha: 7144e4534c34810f4525dc4578a32addd8212cff
          cohort: heldout-round-1
    env:
      LIVE_REPOSITORY: ${{ matrix.case.repository }}
      LIVE_TARGET_SHA: ${{ matrix.case.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 529c937d46e7ae45876a22f52bd4a820ccd0deab
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Provision pinned candidate toolchain without model credentials
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(npm --version)" = 11.19.0

        '
    - name: Bind source to existing successful qualification, not a repeated gate
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        umask 022

        test "$(git rev-parse HEAD)" = 529c937d46e7ae45876a22f52bd4a820ccd0deab

        test "$(git rev-parse HEAD^{tree})" = bfb1fe7c611832297ce3152b7ff46a50823d6730

        test -z "$(git status --porcelain)"

        test "$(node --version)" = v22.19.0

        gh api repos/anirudhsengar/agentify/actions/runs/34108637962 > "$RUNNER_TEMP/existing-qualification.json"

        jq -e ''.status == "completed" and .conclusion == "success" and .head_sha == "743da446b2d6a3a1ac90b8dfe31849f50c19266e"''
        "$RUNNER_TEMP/existing-qualification.json" >/dev/null

        printf ''LIVE_WORK_DIR=%s/pr13-resume-529-%s-%s

        '' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "${{ matrix.case.name }}" >> "$GITHUB_ENV"

        printf ''LIVE_PACK_RESULT=%s/pr13-resume-529-pack.json

        '' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - name: Pack exact qualified bytes
      run: 'set -euo pipefail

        umask 022

        npm run --silent pack:release > "$LIVE_PACK_RESULT"

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.env.LIVE_PACK_RESULT,"utf8"));
        assert.equal(p.sha256,"72b603844e012403cbe09118025c9c997c8cbd56c6f190159acf8532435b7475"); console.log(JSON.stringify(p));''

        '
    - name: Prepare fresh frozen target and install actual npm artifact
      run: npm run --silent live:prepare
    - name: Install with production M3 roles, boundaries, and budgets
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: npm run --silent live:install
    - name: Retain redacted per-target evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: resume-529-${{ matrix.case.name }}-${{ github.run_id }}
        path: '${{ env.LIVE_WORK_DIR }}/evidence

          ${{ runner.temp }}/existing-qualification.json'
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
    - name: Remove disposable target and credentials
      if: always()
      run: if test -n "${LIVE_WORK_DIR:-}"; then rm -rf -- "$LIVE_WORK_DIR"; fi
    needs:
    - canary
  cancellation:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 529c937d46e7ae45876a22f52bd4a820ccd0deab
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Provision pinned candidate toolchain without model credentials
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(npm --version)" = 11.19.0

        '
    - name: Prepare immutable read-only cancellation target
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 529c937d46e7ae45876a22f52bd4a820ccd0deab

        test "$(git rev-parse HEAD^{tree})" = bfb1fe7c611832297ce3152b7ff46a50823d6730

        printf ''PROBE_TARGET=%s/pr13-cancel-target

        PROBE_HOME=%s/pr13-cancel-home

        PROBE_EVIDENCE=%s/pr13-cancel-evidence

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        git init -q "$RUNNER_TEMP/pr13-cancel-target"

        git -C "$RUNNER_TEMP/pr13-cancel-target" fetch --depth=1 https://github.com/anirudhsengar/hono.git e2740d5a1bd0b4254e517e3af8b60789284bc7bd

        git -C "$RUNNER_TEMP/pr13-cancel-target" checkout -q --detach FETCH_HEAD

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: campaign-code
        persist-credentials: false
    - name: Cancel actual M3 production tracer and reconcile reservations
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
      run: node --import tsx campaign-code/.github/qualification/cancel-probe.mjs
    - name: Retain cancellation evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: resume-529-cancellation-${{ github.run_id }}
        path: ${{ env.PROBE_EVIDENCE }}
        if-no-files-found: warn
        retention-days: 14
    - name: Remove probe credentials and target
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/pr13-cancel-home" "$RUNNER_TEMP/pr13-cancel-target"
    needs:
    - canary
