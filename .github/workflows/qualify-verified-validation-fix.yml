name: Qualify verified validation fix

on:
  push:
    branches: [fix/verified-validation-and-shared-context]

permissions:
  contents: write

concurrency:
  group: qualify-verified-validation-fix
  cancel-in-progress: false

jobs:
  clean-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Remove this one-shot workflow and commit the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git rm .github/workflows/qualify-verified-validation-fix.yml
          git commit -m "ci: remove verified validation qualification workflow"
          git push origin HEAD:fix/verified-validation-and-shared-context
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Run complete release qualification
        id: qualify
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/verify-release.log"
          npm run verify:release 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload release qualification diagnostics
        if: steps.qualify.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-validation-release-failure
          path: ${{ runner.temp }}/verify-release.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail unsuccessful qualification
        if: steps.qualify.outputs.status != '0'
        run: exit 1
