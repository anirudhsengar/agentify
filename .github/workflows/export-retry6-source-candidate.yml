name: Export retry6 source candidate

on:
  push:
    branches: [fix/axum-discovery-receipts-public-surfaces]

permissions:
  contents: read

jobs:
  export:
    if: "github.event.head_commit.message == 'ci: export retry6 source candidate'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/axum-discovery-receipts-public-surfaces
          fetch-depth: 0
      - name: Materialize source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path.cwd()
          source = (root / ".github/workflows/retry6-axum-completeness.yml").read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, "<retry6-source-materialization>", "exec"))

          export_workflow = root / ".github/workflows/export-retry6-source-candidate.yml"
          if export_workflow.exists():
              export_workflow.unlink()
          PY
          git diff --check
          ! git status --short | grep -E '^.. \.github/(implementation/|workflows/(apply|export|materialize|qualify|retry))'
          tar --exclude=.git --exclude=node_modules -czf /tmp/retry6-source-candidate.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: retry6-source-candidate
          path: /tmp/retry6-source-candidate.tar.gz
          if-no-files-found: error
          retention-days: 1
