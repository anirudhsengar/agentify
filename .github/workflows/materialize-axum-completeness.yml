name: Materialize Axum discovery completeness fix

on:
  push:
    branches: [fix/axum-discovery-receipts-public-surfaces]

permissions:
  contents: write

concurrency:
  group: materialize-axum-discovery-completeness
  cancel-in-progress: false

jobs:
  materialize-validate-push:
    if: "github.event.head_commit.message == 'ci: materialize axum discovery completeness fix'"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/axum-discovery-receipts-public-surfaces
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply direct production implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          
          ROOT = Path.cwd()
          
          def read(path: str) -> str:
              return (ROOT / path).read_text()
          
          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          
          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}")
              write(path, text.replace(old, new))
          
          write('src/core/audit/explorer-receipts.ts', 'import type { CodebaseMap } from "./schema/index.ts";\n\ntype ExplorerMode = "concern_scout" | "concern_tracer";\n\ninterface ExplorerReceipt {\n  sequence: number;\n  mode: ExplorerMode;\n  success: boolean;\n  targetPath: string;\n  focus: string | null;\n  reportConcern: string | null;\n  failureKind: string | null;\n}\n\nexport interface ExplorerReceiptAssessment {\n  complete: boolean;\n  reasons: string[];\n  successful_scouts: number;\n  successful_tracers: string[];\n  unresolved_tracer_failures: string[];\n  missing_concern_tracers: string[];\n}\n\nexport interface ExplorerReceiptAssessmentOptions {\n  requireScout?: boolean;\n  requiredConcerns?: ReadonlyArray<string>;\n}\n\nconst SEMANTIC_STOP_WORDS = new Set([\n  "and",\n  "candidate",\n  "concern",\n  "for",\n  "from",\n  "implementation",\n  "paths",\n  "seed",\n  "specialist",\n  "subsystem",\n  "the",\n  "trace",\n  "tracer",\n  "with",\n]);\n\nfunction isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === "object" && value !== null;\n}\n\nfunction stringField(value: unknown): string | null {\n  return typeof value === "string" && value.trim().length > 0 ? value.trim() : null;\n}\n\nfunction resultText(result: unknown): string {\n  if (!isRecord(result)) return "";\n  if (typeof result.resultText === "string") return result.resultText;\n  if (!Array.isArray(result.content)) return "";\n  return result.content\n    .filter((block): block is { type?: unknown; text?: unknown } => isRecord(block))\n    .filter((block) => block.type === "text" && typeof block.text === "string")\n    .map((block) => block.text as string)\n    .join("\\n");\n}\n\nfunction modeFromResult(result: unknown, text: string): ExplorerMode | null {\n  if (isRecord(result) && isRecord(result.details)) {\n    const mode = stringField(result.details.mode);\n    if (mode === "concern_scout" || mode === "concern_tracer") return mode;\n  }\n  const match = text.match(/\\bmode=(concern_scout|concern_tracer)\\b/i);\n  const mode = match?.[1]?.toLowerCase();\n  return mode === "concern_scout" || mode === "concern_tracer" ? mode : null;\n}\n\nfunction reportConcernFromText(text: string): string | null {\n  const match = text.match(/(?:^|\\n)\\s*concern:\\s*([^\\r\\n]+)/i);\n  return match?.[1]?.trim() || null;\n}\n\nfunction semanticTokens(value: string): Set<string> {\n  const tokens = new Set<string>();\n  for (const raw of value.toLowerCase().match(/[a-z0-9]+/g) ?? []) {\n    if (raw.length < 3 || SEMANTIC_STOP_WORDS.has(raw)) continue;\n    const normalized = raw.length > 4 && raw.endsWith("s") ? raw.slice(0, -1) : raw;\n    tokens.add(normalized);\n  }\n  return tokens;\n}\n\nfunction tokenRelated(left: string, right: string): boolean {\n  return left === right\n    || (Math.min(left.length, right.length) >= 5\n      && (left.startsWith(right) || right.startsWith(left)));\n}\n\nfunction semanticallyRelated(left: string, right: string): boolean {\n  const normalizedLeft = left.trim().toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();\n  const normalizedRight = right.trim().toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();\n  if (!normalizedLeft || !normalizedRight) return false;\n  if (\n    normalizedLeft === normalizedRight\n    || normalizedLeft.includes(normalizedRight)\n    || normalizedRight.includes(normalizedLeft)\n  ) {\n    return true;\n  }\n\n  const leftTokens = semanticTokens(left);\n  const rightTokens = semanticTokens(right);\n  if (leftTokens.size === 0 || rightTokens.size === 0) return false;\n  let matches = 0;\n  for (const token of leftTokens) {\n    if ([...rightTokens].some((other) => tokenRelated(token, other))) matches += 1;\n  }\n  const minimum = Math.min(leftTokens.size, rightTokens.size);\n  return matches >= 2 || (matches >= 1 && matches / minimum >= 0.6);\n}\n\nfunction receiptIdentity(receipt: ExplorerReceipt): string {\n  return receipt.reportConcern ?? receipt.focus ?? receipt.targetPath;\n}\n\nfunction failureDescription(receipt: ExplorerReceipt): string {\n  const identity = receiptIdentity(receipt);\n  return receipt.failureKind === "timeout"\n    ? `${identity} (timed out)`\n    : identity;\n}\n\nexport class ExplorerReceiptTracker {\n  readonly #receipts: ExplorerReceipt[] = [];\n  #sequence = 0;\n\n  observe(event: unknown): void {\n    if (!isRecord(event) || event.type !== "tool_execution_end") return;\n    const toolName = stringField(event.toolName) ?? stringField(event.tool_name);\n    if (toolName !== "spawn_explorer") return;\n\n    const result = event.result;\n    const text = resultText(result);\n    const mode = modeFromResult(result, text);\n    if (mode === null) return;\n    const details = isRecord(result) && isRecord(result.details) ? result.details : {};\n    const targetPath = stringField(details.target_path)\n      ?? text.match(/\\b(?:explored|for)\\s+(.+?)\\s+(?:in\\s+\\d+ms|failed:)/i)?.[1]?.trim()\n      ?? ".";\n    const focus = stringField(details.focus);\n    const reportConcern = stringField(details.report_concern)\n      ?? (mode === "concern_tracer" ? reportConcernFromText(text) : null);\n    const success = !(isRecord(result) && result.isError === true);\n    const failureKind = success\n      ? null\n      : stringField(details.failure_kind)\n        ?? (/timeout|timed out/i.test(text) ? "timeout" : "error");\n\n    this.#sequence += 1;\n    this.#receipts.push({\n      sequence: this.#sequence,\n      mode,\n      success,\n      targetPath,\n      focus,\n      reportConcern,\n      failureKind,\n    });\n  }\n\n  assess(\n    map: CodebaseMap | null,\n    options: ExplorerReceiptAssessmentOptions = {},\n  ): ExplorerReceiptAssessment {\n    const requireScout = options.requireScout ?? true;\n    const requiredConcerns = options.requiredConcerns\n      ?? map?.concern_evidence?.concerns.map((concern) => concern.concern)\n      ?? [];\n    const scouts = this.#receipts.filter((receipt) =>\n      receipt.mode === "concern_scout" && receipt.success\n    );\n    const successfulTracers = this.#receipts.filter((receipt) =>\n      receipt.mode === "concern_tracer" && receipt.success\n    );\n    const failedTracers = this.#receipts.filter((receipt) =>\n      receipt.mode === "concern_tracer" && !receipt.success\n    );\n\n    const missingConcernTracers = requiredConcerns.filter((concern) =>\n      !successfulTracers.some((receipt) =>\n        semanticallyRelated(concern, receiptIdentity(receipt))\n      )\n    );\n    const unresolvedFailures = failedTracers.filter((failure) =>\n      !successfulTracers.some((success) =>\n        success.sequence > failure.sequence\n        && semanticallyRelated(receiptIdentity(failure), receiptIdentity(success))\n      )\n    );\n\n    const reasons: string[] = [];\n    if (requireScout && scouts.length === 0) {\n      reasons.push("successful concern_scout receipt is missing");\n    }\n    for (const concern of missingConcernTracers) {\n      reasons.push(`accepted concern "${concern}" has no successful concern_tracer receipt`);\n    }\n    for (const failure of unresolvedFailures) {\n      reasons.push(\n        `concern_tracer for "${failureDescription(failure)}" failed and was not successfully retraced`,\n      );\n    }\n\n    return {\n      complete: reasons.length === 0,\n      reasons,\n      successful_scouts: scouts.length,\n      successful_tracers: successfulTracers.map(receiptIdentity),\n      unresolved_tracer_failures: unresolvedFailures.map(failureDescription),\n      missing_concern_tracers: missingConcernTracers,\n    };\n  }\n}\n')
          write('tests/audit/explorer-receipts.test.ts', 'import assert from "node:assert/strict";\nimport test from "node:test";\nimport type { CodebaseMap } from "../../src/core/audit/schema.ts";\nimport { ExplorerReceiptTracker } from "../../src/core/audit/explorer-receipts.ts";\n\nfunction mapWithConcerns(...concerns: string[]): CodebaseMap {\n  return {\n    concern_evidence: {\n      concerns: concerns.map((concern) => ({ concern })),\n      not_concerns: [],\n    },\n  } as unknown as CodebaseMap;\n}\n\nfunction explorerEvent(input: {\n  mode: "concern_scout" | "concern_tracer";\n  success: boolean;\n  focus?: string;\n  reportConcern?: string;\n  targetPath?: string;\n  failureKind?: string;\n}): unknown {\n  const text = input.success\n    ? `Sub-agent (mode=${input.mode}) explored ${input.targetPath ?? "."} in 10ms.\\n\\n`\n      + (input.reportConcern ? `## Report\\nconcern: ${input.reportConcern}\\n` : "## Report\\n")\n    : `Error: sub-agent (mode=${input.mode}) for ${input.targetPath ?? "."} failed: timeout`;\n  return {\n    type: "tool_execution_end",\n    toolName: "spawn_explorer",\n    result: {\n      ...(input.success ? {} : { isError: true }),\n      content: [{ type: "text", text }],\n      details: {\n        mode: input.mode,\n        target_path: input.targetPath ?? ".",\n        focus: input.focus ?? null,\n        report_concern: input.reportConcern ?? null,\n        failure_kind: input.failureKind ?? (input.success ? null : "timeout"),\n      },\n    },\n  };\n}\n\ntest("semantic closure requires successful scout and per-concern tracer receipts", () => {\n  const tracker = new ExplorerReceiptTracker();\n  const map = mapWithConcerns("Routing and route composition", "Request extraction");\n\n  let assessment = tracker.assess(map);\n  assert.equal(assessment.complete, false);\n  assert.ok(assessment.reasons.some((reason) => reason.includes("concern_scout")));\n  assert.deepEqual(assessment.missing_concern_tracers, [\n    "Routing and route composition",\n    "Request extraction",\n  ]);\n\n  tracker.observe(explorerEvent({ mode: "concern_scout", success: true }));\n  tracker.observe(explorerEvent({\n    mode: "concern_tracer",\n    success: true,\n    focus: "Routing and route composition",\n    reportConcern: "Routing and route composition",\n  }));\n  tracker.observe(explorerEvent({\n    mode: "concern_tracer",\n    success: true,\n    focus: "Request extraction",\n    reportConcern: "Request extraction, rejection, and body parsing",\n  }));\n\n  assessment = tracker.assess(map);\n  assert.equal(assessment.complete, true, assessment.reasons.join("; "));\n});\n\ntest("a timed-out tracer remains unresolved instead of becoming a rejection", () => {\n  const tracker = new ExplorerReceiptTracker();\n  tracker.observe(explorerEvent({ mode: "concern_scout", success: true }));\n  tracker.observe(explorerEvent({\n    mode: "concern_tracer",\n    success: false,\n    focus: "Procedural macro derives and diagnostics",\n    targetPath: "axum-macros",\n  }));\n\n  const incomplete = tracker.assess(mapWithConcerns(), { requiredConcerns: [] });\n  assert.equal(incomplete.complete, false);\n  assert.deepEqual(\n    incomplete.unresolved_tracer_failures,\n    ["Procedural macro derives and diagnostics (timed out)"],\n  );\n\n  tracker.observe(explorerEvent({\n    mode: "concern_tracer",\n    success: true,\n    focus: "Procedural macro derives and diagnostics",\n    reportConcern: "Procedural macro derives and diagnostics",\n    targetPath: "axum-macros",\n  }));\n  const complete = tracker.assess(mapWithConcerns(), { requiredConcerns: [] });\n  assert.equal(complete.complete, true, complete.reasons.join("; "));\n});\n')
          write('tests/audit/workspace-public-surface-closure.test.ts', 'import assert from "node:assert/strict";\nimport { spawnSync } from "node:child_process";\nimport * as fs from "node:fs";\nimport * as os from "node:os";\nimport * as path from "node:path";\nimport test from "node:test";\nimport {\n  assessSpecialistEvidence,\n  type CodebaseMap,\n} from "../../src/core/audit/schema.ts";\nimport { makeValidCodebaseMap } from "../fixtures/codebase-map.ts";\n\ntype Concern = NonNullable<CodebaseMap["concern_evidence"]>["concerns"][number];\n\nfunction git(cwd: string, ...args: string[]): void {\n  const result = spawnSync("git", ["-C", cwd, ...args], { encoding: "utf8" });\n  assert.equal(result.status, 0, result.stderr);\n}\n\nfunction write(cwd: string, repositoryPath: string, content: string): void {\n  const absolute = path.join(cwd, ...repositoryPath.split("/"));\n  fs.mkdirSync(path.dirname(absolute), { recursive: true });\n  fs.writeFileSync(absolute, content);\n}\n\nfunction concern(input: {\n  name: string;\n  core: string;\n  supporting?: string[];\n}): Concern {\n  const paths = [input.core, ...(input.supporting ?? [])];\n  const steps = paths.length > 1\n    ? paths.map((repositoryPath, index) => ({\n        path: repositoryPath,\n        what_happens: `Executes verified operation ${index + 1} for ${input.name}.`,\n      }))\n    : [\n        { path: input.core, what_happens: `Declares the public ${input.name} API.` },\n        { path: input.core, what_happens: `Expands and validates ${input.name} behavior.` },\n      ];\n  return {\n    concern: input.name,\n    one_line: `Owns ${input.name}.`,\n    covers: `Public and inline-tested behavior for ${input.name}.`,\n    excludes: "Other workspace package surfaces remain separate.",\n    flows: [{\n      name: `${input.name} flow`,\n      description: `Observed ${input.name} behavior.`,\n      steps,\n    }],\n    touchpoints: paths.map((repositoryPath, index) => ({\n      path: repositoryPath,\n      symbol: null,\n      role: `${index === 0 ? "Core" : "Supporting"} ${input.name} surface.`,\n      line_range: null,\n      centrality: index === 0 ? "core" as const : "supporting" as const,\n    })),\n    invariants: [],\n    pitfalls: [],\n    entry_questions: [`Does this alter ${input.name}?`],\n    validation: ["cargo test --workspace"],\n    spans_subtrees: [...new Set(paths.map((repositoryPath) => repositoryPath.split("/")[0]!)],\n    stability: "high",\n    recurrence: "high",\n    confidence: "high",\n    last_updated: "2026-08-27T00:00:00.000Z",\n  };\n}\n\nfunction createWorkspace(): string {\n  const cwd = fs.mkdtempSync(path.join(os.tmpdir(), "agentify-workspace-surfaces-"));\n  write(cwd, "README.md", "# fixture\\n");\n  write(cwd, "Cargo.toml", "[workspace]\\nmembers = [\\"axum\\", \\"axum-extra\\", \\"axum-macros\\"]\\n");\n  write(cwd, "axum/Cargo.toml", "[package]\\nname = \\"axum\\"\\nversion = \\"0.1.0\\"\\n");\n  write(cwd, "axum/src/lib.rs", "pub mod routing;\\n");\n  write(cwd, "axum/src/routing.rs", "pub fn route() {}\\n#[cfg(test)] mod tests { #[test] fn route_works() {} }\\n");\n  write(cwd, "axum-extra/Cargo.toml", "[package]\\nname = \\"axum-extra\\"\\nversion = \\"0.1.0\\"\\n");\n  write(cwd, "axum-extra/src/lib.rs", "pub mod response;\\n");\n  write(cwd, "axum-extra/src/response/mod.rs", "pub fn respond() {}\\n#[cfg(test)] mod tests { #[test] fn response_works() {} }\\n");\n  write(cwd, "axum-macros/Cargo.toml", "[package]\\nname = \\"axum-macros\\"\\nversion = \\"0.1.0\\"\\n");\n  write(cwd, "axum-macros/src/lib.rs", "#[proc_macro_attribute] pub fn debug_handler() {}\\n#[cfg(test)] mod tests { #[test] fn expands() {} }\\n");\n  git(cwd, "init", "-q");\n  git(cwd, "config", "user.name", "Agentify Test");\n  git(cwd, "config", "user.email", "agentify@example.invalid");\n  git(cwd, "add", ".");\n  git(cwd, "commit", "-qm", "workspace fixture");\n  return cwd;\n}\n\nfunction workspaceMap(): CodebaseMap {\n  const map = makeValidCodebaseMap();\n  delete map.expert_evidence;\n  map.meta.project_type = "Rust workspace";\n  map.meta.languages = ["Rust"];\n  map.skeleton.entry_points = [{\n    path: "axum/src/lib.rs",\n    role: "primary crate API",\n    language: "Rust",\n    run_command: "cargo test --workspace",\n  }];\n  map.skeleton.first_5_files_for_fresh_agent = [{\n    path: "axum/src/lib.rs",\n    why: "primary public API",\n  }];\n  map.module_graph.edges = [];\n  map.module_graph.parallelizable_subtrees = [];\n  map.module_graph.shared_abstractions = [];\n  map.module_graph.shared_state = [];\n  map.type_contract_surface.type_definitions = [];\n  map.type_contract_surface.typescript_interfaces = [];\n  map.type_contract_surface.pydantic_models = [];\n  map.type_contract_surface.db_models = [];\n  map.type_contract_surface.api_contracts = [];\n  map.type_contract_surface.one_type_trace = null;\n  map.pitfalls = [];\n  map.operational_surface.build.recipe_file = "Cargo.toml";\n  map.open_questions = [];\n  map.concern_evidence = {\n    concerns: [concern({\n      name: "routing",\n      core: "axum/src/lib.rs",\n      supporting: ["axum/src/routing.rs"],\n    })],\n    not_concerns: [],\n  };\n  return map;\n}\n\ntest("workspace public surfaces and inline-tested modules remain semantic obligations", () => {\n  const cwd = createWorkspace();\n  try {\n    const map = workspaceMap();\n    const incomplete = assessSpecialistEvidence(map, { cwd });\n    assert.equal(incomplete.complete, false);\n    for (const repositoryPath of [\n      "axum-extra/src/lib.rs",\n      "axum-extra/src/response/mod.rs",\n      "axum-macros/src/lib.rs",\n    ]) {\n      assert.ok(incomplete.uncovered_paths.includes(repositoryPath), repositoryPath);\n    }\n    assert.ok(incomplete.repository_clusters.some((cluster) =>\n      cluster.kind === "workspace-public-surface"\n      && cluster.implementation_paths.includes("axum-macros/src/lib.rs")\n    ));\n    assert.ok(incomplete.repository_clusters.some((cluster) =>\n      cluster.kind === "inline-tested-surface"\n      && cluster.implementation_paths.includes("axum-extra/src/response/mod.rs")\n    ));\n\n    map.concern_evidence!.concerns.push(\n      concern({\n        name: "response extensions",\n        core: "axum-extra/src/lib.rs",\n        supporting: ["axum-extra/src/response/mod.rs"],\n      }),\n      concern({\n        name: "procedural macro derives and diagnostics",\n        core: "axum-macros/src/lib.rs",\n      }),\n    );\n    const complete = assessSpecialistEvidence(map, { cwd });\n    assert.equal(complete.complete, true, complete.reasons.join("; "));\n  } finally {\n    fs.rmSync(cwd, { recursive: true, force: true });\n  }\n});\n')
          write('tests/specialists/flow-preservation.test.ts', 'import assert from "node:assert/strict";\nimport test from "node:test";\nimport { discoverSpecialistPortfolio } from "../../src/core/specialists/discovery.ts";\nimport {\n  SPECIALIST_FIXTURE_TRACKED_FILES,\n  makeSpecialistFixtureMap,\n} from "../fixtures/specialist-map.ts";\n\ntest("materialization preserves every verified ordered flow step", () => {\n  const map = makeSpecialistFixtureMap();\n  const concern = map.concern_evidence!.concerns.find((entry) =>\n    entry.concern === "authentication"\n  );\n  assert.ok(concern);\n  concern.flows[0]!.steps = [\n    {\n      path: "src/routes/login.ts",\n      what_happens: "Accepts the credential payload.",\n    },\n    {\n      path: "src/auth/lookup.ts",\n      what_happens: "Loads the account and its credential state.",\n    },\n    {\n      path: "src/auth/verify.ts",\n      what_happens: "Compares the hash and issues a session.",\n    },\n    {\n      path: "src/middleware/session.ts",\n      what_happens: "Stores the session for later requests.",\n    },\n  ];\n\n  const portfolio = discoverSpecialistPortfolio(\n    map,\n    "a".repeat(40),\n    [...SPECIALIST_FIXTURE_TRACKED_FILES, "src/auth/lookup.ts"],\n  );\n  const specialist = portfolio.specialists.find((entry) =>\n    entry.concern === "authentication"\n  );\n  assert.ok(specialist);\n  assert.deepEqual(\n    specialist.flows[0]?.steps.map((step) => step.path),\n    [\n      "src/routes/login.ts",\n      "src/auth/lookup.ts",\n      "src/auth/verify.ts",\n      "src/middleware/session.ts",\n    ],\n  );\n  assert.ok(specialist.context_paths.includes("src/auth/lookup.ts"));\n  assert.ok(specialist.touchpoints.some((touchpoint) =>\n    touchpoint.path === "src/auth/lookup.ts"\n    && touchpoint.role.includes("Loads the account")\n  ));\n});\n')
          replace_exact('src/core/audit/spawn-explorer-tool.ts', 'function truncateReport(report: string): { report: string; truncated: boolean; report_length: number } {', 'function reportConcernName(report: string): string | null {\n    const match = report.match(/(?:^|\\n)\\s*concern:\\s*([^\\r\\n]+)/i);\n    return match?.[1]?.trim() || null;\n}\n\nfunction truncateReport(report: string): { report: string; truncated: boolean; report_length: number } {', 1)
          replace_exact('src/core/audit/spawn-explorer-tool.ts', '                    report_truncated_path: truncatedPath || null,\n                    reads: readCount,', '                    report_truncated_path: truncatedPath || null,\n                    report_concern: mode === "concern_tracer" ? reportConcernName(rawReport) : null,\n                    reads: readCount,', 1)
          replace_exact('src/core/audit/spawn-explorer-tool.ts', '        } catch (err) {\n            const msg = err instanceof Error ? err.message : String(err);\n            return {\n                content: [\n                    {\n                        type: "text",\n                        text: `Error: sub-agent (mode=${mode}) for ${params.target_path} failed: ${msg}`,\n                    },\n                ],\n                isError: true,\n                details: undefined as unknown as Record<string, unknown>,\n            };\n        } finally {', '        } catch (err) {\n            const msg = err instanceof Error ? err.message : String(err);\n            return {\n                content: [\n                    {\n                        type: "text",\n                        text: `Error: sub-agent (mode=${mode}) for ${params.target_path} failed: ${msg}`,\n                    },\n                ],\n                isError: true,\n                details: {\n                    mode,\n                    target_path: params.target_path,\n                    resolved_target_path: resolvedTarget,\n                    focus: params.focus ?? null,\n                    summary: params.summary ?? null,\n                    error_message: msg,\n                    failure_kind: /timeout|timed out/i.test(msg) ? "timeout" : "error",\n                    duration_ms: Date.now() - start,\n                    run_id: runId,\n                },\n            };\n        } finally {', 1)
