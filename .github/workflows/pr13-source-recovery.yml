name: Temporary PR13 receipt-handoff source staging
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      github.event.label.name == 'agentify-stage-receipt-handoff' &&
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c46c5783253db5516dd91c503a69db926579425e
          persist-credentials: false
      - name: Stage only verified ordinary source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/anirudhsengar/agentify/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          compressed_sha = '5f525ac484cfec9ae50591a5d5d6c5788f733b0e'
          with urllib.request.urlopen(urllib.request.Request(api + '/' + compressed_sha, headers=headers), timeout=30) as response:
              stored = json.load(response)
          compressed = base64.b64decode(stored['content'])
          assert stored['sha'] == compressed_sha and stored['encoding'] == 'base64'
          assert hashlib.sha1(b'blob ' + str(len(compressed)).encode() + b'\0' + compressed).hexdigest() == compressed_sha
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'cbf3d0a9c033834417903d9b5d8d426dd52639c088a71bc4cb5a96334a06d57f'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '59d8280a20a26b9dfb402daf4c1855a9f1478586', tree
          expected = {'CHANGELOG.md': '16ecbb064d6818e595f4e9221cfc36a48e4b4269', 'docs/architecture/install-once-repository-team.md': '8c286c201197e164286b914c32a96a17de5c0d78', 'src/core/runs/repository-audit-run-core.ts': 'bc32aad42b6a364ec85821640d4e7161c0023a591', 'src/core/runs/repository-audit-run.ts': '0f6d320dbab36646cb4195788b5b457c6fa4c0f7', 'tests/audit/tracked-specialist-closure.test.ts': '79063370fb48169c2eed508cd6a0b6994b2f031b'}
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(expected)
          for name, sha in expected.items():
              assert not name.startswith('.github/')
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              with urllib.request.urlopen(urllib.request.Request(api, data=body, headers=headers, method='POST'), timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha
              print(name, sha)
          print('Verified tree:', tree, '; no commit or ref was written.')
          PY
