name: Finalize PR 11 source-only v4

on:
  push:
    branches: [fix/axum-discovery-receipts-public-surfaces]

permissions:
  contents: write

concurrency:
  group: finalize-pr11-source-only-v4-exact
  cancel-in-progress: false

jobs:
  finalize:
    if: "github.event.head_commit.message == 'ci: finalize pr11 source-only v4'"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/axum-discovery-receipts-public-surfaces
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Materialize and correct the source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path.cwd()
          source = (root / ".github/workflows/finalize-pr11-source-v3.yml").read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, "<finalize-v3-materialization>", "exec"))

          tracked_path = root / "tests/audit/tracked-specialist-closure.test.ts"
          tracked = tracked_path.read_text()
          class_start = tracked.index("class ProgressiveRepairRuntime implements AgentRuntime")
          write_start = tracked.index("        fs.writeFileSync(destination", class_start)
          insert_at = tracked.index("      }\n    } else {", write_start)
          insertion = "\n".join([
              "        options.onEvent?.({",
              "          type: \"tool_execution_end\",",
              "          toolName: \"spawn_explorer\",",
              "          resultText: \"Sub-agent (mode=concern_scout) explored . in 1ms.\\n\\n## Report\\n\",",
              "          details: {",
              "            mode: \"concern_scout\",",
              "            target_path: \".\",",
              "            focus: null,",
              "            report_concern: null,",
              "          },",
              "        } as never);",
              "        for (const concern of repaired.concern_evidence?.concerns ?? []) {",
              "          options.onEvent?.({",
              "            type: \"tool_execution_end\",",
              "            toolName: \"spawn_explorer\",",
              "            resultText: `Sub-agent (mode=concern_tracer) explored . in 1ms.\\n\\n## Report\\nconcern: ${concern.concern}\\n`,",
              "            details: {",
              "              mode: \"concern_tracer\",",
              "              target_path: \".\",",
              "              focus: concern.concern,",
              "              report_concern: concern.concern,",
              "            },",
              "          } as never);",
              "        }",
              "",
          ])
          tracked = tracked[:insert_at] + insertion + tracked[insert_at:]

          else_old = "\n".join([
              "    } else {",
              "      this.baseCalls += 1;",
              "    }",
          ])
          else_new = "\n".join([
              "    } else {",
              "      this.baseCalls += 1;",
              "      const currentMapPath = path.join(",
              "        options.cwd,",
              "        options.spawnExplorerStateDir ?? \".agentify/runtime/audit\",",
              "        \"codebase_map.json\",",
              "      );",
              "      const current = JSON.parse(fs.readFileSync(currentMapPath, \"utf8\")) as CodebaseMap;",
              "      options.onEvent?.({",
              "        type: \"tool_execution_end\",",
              "        toolName: \"spawn_explorer\",",
              "        resultText: \"Sub-agent (mode=concern_scout) explored . in 1ms.\\n\\n## Report\\n\",",
              "        details: {",
              "          mode: \"concern_scout\",",
              "          target_path: \".\",",
              "          focus: null,",
              "          report_concern: null,",
              "        },",
              "      } as never);",
              "      for (const concern of current.concern_evidence?.concerns ?? []) {",
              "        options.onEvent?.({",
              "          type: \"tool_execution_end\",",
              "          toolName: \"spawn_explorer\",",
              "          resultText: `Sub-agent (mode=concern_tracer) explored . in 1ms.\\n\\n## Report\\nconcern: ${concern.concern}\\n`,",
              "          details: {",
              "            mode: \"concern_tracer\",",
              "            target_path: \".\",",
              "            focus: concern.concern,",
              "            report_concern: concern.concern,",
              "          },",
              "        } as never);",
              "      }",
              "    }",
          ])
          count = tracked.count(else_old)
          if count != 1:
              raise RuntimeError(f"tracked base receipt patch expected once, found {count}")
          tracked_path.write_text(tracked.replace(else_old, else_new, 1))
          PY

          rm -rf .github
          git checkout origin/main -- .github
          git add -A
          git diff --cached --check
          git status --short
      - name: Install exact dependencies
        run: npm ci
      - name: Run focused discovery regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx tests/audit/explorer-receipts.test.ts
          npx tsx tests/audit/workspace-public-surface-closure.test.ts
          npx tsx tests/audit/spawn-explorer-budget.test.ts
          npx tsx tests/audit/coverage-gate.test.ts
          npx tsx tests/audit/tracked-specialist-closure.test.ts
          npx tsx tests/specialists/flow-preservation.test.ts
          npx tsx tests/specialists/command-contracts.test.ts
      - name: Run complete release qualification
        run: npm run verify:release
      - name: Publish a clean main-parented PR head
        shell: bash
        env:
          EXPECTED_OLD_HEAD: fc4f04d06746e70da463b4bf95211910a53b3b20
          TARGET_BRANCH: fix/trusted-specialist-discovery-workspace-closure
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          parent=$(git rev-parse origin/main)
          commit=$(printf '%s\n\n%s\n' \
            'fix: require trusted specialist discovery closure' \
            'Require successful current-HEAD explorer receipts, workspace/public-surface ownership, complete verified flows, and strict command classification.' \
            | git commit-tree "$tree" -p "$parent")

          files=$(git diff --name-only "$parent" "$commit")
          printf '%s\n' "$files"
          test -n "$files"
          ! printf '%s\n' "$files" | grep -Ev '^(src|tests)/'
          printf '%s\n' "$files" | grep -Eq '^src/'
          printf '%s\n' "$files" | grep -Eq '^tests/'
          node scripts/verify-implementation-diff.mjs "$parent" "$commit"

          remote_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$remote_head" = "$EXPECTED_OLD_HEAD"
          git push origin "$commit:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_HEAD"
          echo "Published clean PR head: $commit"
