name: Apply semantic ownership and readiness documentation fix

on:
  push:
    branches: [fix/semantic-ownership-and-readiness-docs]

permissions:
  contents: write

concurrency:
  group: apply-semantic-ownership-readiness
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: "github.event.head_commit.message == 'ci: rerun semantic ownership and readiness fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/semantic-ownership-and-readiness-docs
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply production implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          payload = ""
          exec(compile(gzip.decompress(base64.b64decode(payload)), "<semantic-fix>", "exec"))
          PY
          rm -f .github/workflows/apply-semantic-ownership-readiness.yml
          git diff --check
          git status --short
      - name: Commit exact candidate before qualification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce semantic ownership and readiness-aware guidance"
      - run: npm ci
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx --test \
            tests/specialists/unbounded-specialist-portfolio.test.ts \
            tests/audit/exclusion-aware-semantic-closure.test.ts \
            tests/audit/locality-aware-semantic-closure.test.ts \
            tests/scaffold-readiness-docs.test.ts
      - name: Run complete release qualification
        run: npm run verify:release
      - name: Push qualified source candidate
        run: git push origin HEAD:fix/semantic-ownership-and-readiness-docs
