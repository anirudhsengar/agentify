name: Apply verified validation fix

on:
  push:
    branches: [fix/verified-validation-and-shared-context]

permissions:
  contents: write

concurrency:
  group: apply-verified-validation-fix
  cancel-in-progress: false

jobs:
  apply-qualify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply exact locally qualified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/implementation/verified-validation.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/verified-validation.patch
          git apply --check /tmp/verified-validation.patch
          git apply /tmp/verified-validation.patch
          rm -f \
            .github/implementation/verified-validation.patch.gz.b64.part* \
            .github/workflows/apply-verified-validation-fix.yml
          rmdir .github/implementation 2>/dev/null || true
          git diff --check
      - run: npm ci
      - name: Run complete release qualification
        id: qualify
        shell: bash
        run: |
          set +e
          npm run verify:release 2>&1 | tee verify-release.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload release qualification diagnostics
        if: steps.qualify.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-validation-release-failure
          path: verify-release.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail unsuccessful qualification
        if: steps.qualify.outputs.status != '0'
        run: exit 1
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: require verified tests and shared specialist context"
          git push origin HEAD:fix/verified-validation-and-shared-context
