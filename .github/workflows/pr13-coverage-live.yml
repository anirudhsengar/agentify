name: PR13 fresh installation after typed coverage correction
run-name: PR13 a8d8cd5 fresh PyJWT, gated by exact qualification
'on':
  push:
    branches:
    - validation/pr13-coverage-live-20260907
    paths:
    - .github/workflows/pr13-coverage-live.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-coverage-live-a8
  cancel-in-progress: false
jobs:
  install:
    if: github.actor == github.repository_owner
    name: ${{ matrix.case.cohort }} / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - name: pyjwt
          repository: anirudhsengar/pyjwt
          sha: 7144e4534c34810f4525dc4578a32addd8212cff
          cohort: heldout-round-1
    env:
      LIVE_REPOSITORY: ${{ matrix.case.repository }}
      LIVE_TARGET_SHA: ${{ matrix.case.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: a8d8cd539f0aebba4c8bdabd26a703c64a409fcd
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Provision pinned candidate toolchain without model credentials
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y ripgrep fd-find

        if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi

        npm install --global npm@11.19.0

        npm ci --ignore-scripts

        test "$(npm --version)" = 11.19.0

        '
    - name: Require successful exact-candidate qualification and its verified package hash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\numask 022\ntest \"$(git rev-parse HEAD)\" = a8d8cd539f0aebba4c8bdabd26a703c64a409fcd\n\
        test \"$(git rev-parse HEAD^{tree})\" = f810a3787b2f58f6e71e9728a5f37875abf063c0\ntest -z \"$(git status\
        \ --porcelain)\"\ntest \"$(node --version)\" = v22.19.0\nfor attempt in $(seq 1 35); do\n  gh api repos/anirudhsengar/agentify/actions/runs/34118827743\
        \ > \"$RUNNER_TEMP/existing-qualification.json\"\n  status=$(jq -r .status \"$RUNNER_TEMP/existing-qualification.json\"\
        )\n  if test \"$status\" = completed; then break; fi\n  sleep 20\ndone\njq -e '.status == \"completed\"\
        \ and .conclusion == \"success\" and .head_sha == \"8b63ad0b4b90f9c9a127edc7c28d07f63c9c018f\"' \"$RUNNER_TEMP/existing-qualification.json\"\
        \ >/dev/null\ngh run download 34118827743 -R anirudhsengar/agentify -n pr13-coverage-shapes-node-22.19.0-34118827743\
        \ -D \"$RUNNER_TEMP/qualified-source\"\ntest \"$(cat \"$RUNNER_TEMP/qualified-source/pr13-coverage-shapes-qualification.exit\"\
        )\" = 0\ngrep -Fx 'candidate=a8d8cd539f0aebba4c8bdabd26a703c64a409fcd' \"$RUNNER_TEMP/qualified-source/pr13-coverage-shapes-environment.txt\"\
        \ngrep -Fx 'tree=f810a3787b2f58f6e71e9728a5f37875abf063c0' \"$RUNNER_TEMP/qualified-source/pr13-coverage-shapes-environment.txt\"\
        \npython3 - <<'PYQUAL'\nfrom pathlib import Path\nimport os,re\nroot=Path(os.environ['RUNNER_TEMP']);log=(root/'qualified-source/pr13-coverage-shapes-qualification.log').read_text()\n\
        found=re.findall(r'exact installed artifact qualification passed \\([^,]+, ([a-f0-9]{64}), 52 entries\\\
        )',log)\nassert len(found)==1\nwith open(os.environ['GITHUB_ENV'],'a') as f:f.write('LIVE_EXPECTED_PACKAGE_HASH='+found[0]+'\\\
        n')\nPYQUAL\nprintf 'LIVE_WORK_DIR=%s/pr13-coverage-%s\\n' \"$RUNNER_TEMP\" \"$GITHUB_RUN_ID\" >> \"$GITHUB_ENV\"\
        \nprintf 'LIVE_PACK_RESULT=%s/pr13-coverage-pack.json\\n' \"$RUNNER_TEMP\" >> \"$GITHUB_ENV\"\n"
    - name: Pack exact qualified bytes
      run: 'set -euo pipefail

        umask 022

        npm run --silent pack:release > "$LIVE_PACK_RESULT"

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.env.LIVE_PACK_RESULT,"utf8"));
        assert.equal(p.sha256,process.env.LIVE_EXPECTED_PACKAGE_HASH); console.log(JSON.stringify(p));''

        '
    - name: Prepare fresh frozen target and install actual npm artifact
      run: npm run --silent live:prepare
    - name: Install with production M3 roles, boundaries, and budgets
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: npm run --silent live:install
    - name: Retain redacted per-target evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage-live-pyjwt-${{ github.run_id }}
        path: '${{ env.LIVE_WORK_DIR }}/evidence

          ${{ runner.temp }}/existing-qualification.json

          ${{ runner.temp }}/qualified-source/pr13-coverage-shapes-environment.txt'
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
    - name: Remove disposable target and credentials
      if: always()
      run: if test -n "${LIVE_WORK_DIR:-}"; then rm -rf -- "$LIVE_WORK_DIR"; fi
