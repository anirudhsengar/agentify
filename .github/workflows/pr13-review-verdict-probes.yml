name: PR13 explicit review verdict component qualification
run-name: PR13 M3 provider-error diagnosis and false-claim rejection canary
'on':
  push:
    branches:
    - validation/pr13-verdict-probes-20260907
    paths:
    - .github/workflows/pr13-review-verdict-probes.yml
    - .github/qualification/review-probe.mjs
    - .github/qualification/review-cases.json
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-explicit-verdict-probes
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == github.repository_owner
    name: Review / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - name: commander-help
          artifact: pr13-cd24-historical-commander-34101652351
          map_sha256: 68e0447d855d436c9dfad9aadaa20a132c7e06f1aa9bdf6dfde76ad3888dd5f4
          concern: Help rendering
          target_sha: ba6d13ddb4243e5913367734f8c159089ffe7834
          repository: anirudhsengar/commander.js
        - name: pyjwt-numeric-exp-canary
          artifact: pr13-cd24-heldout-round-1-pyjwt-34101652351
          map_sha256: 2bbed000f4b8fb433f2bc74d1cedcfc4cb81e84739ed2317c9d5642b18f11c89
          concern: JWT registered claim validation
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          false_claim_canary: true
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 6a6678abbca8acf4d2dc2e81376e0b50faf2d624
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
        cache: npm
    - name: Install pinned test toolchain, no model credentials
      run: 'npm install --global npm@11.19.0

        npm ci --ignore-scripts'
    - name: Fetch exact retained input and immutable repository
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: 'set -euo pipefail

        printf ''PROBE_TARGET=%s/probe-target

        PROBE_PREVIOUS=%s/previous

        PROBE_EVIDENCE=%s/evidence

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''HOME=%s/probe-home

        USERPROFILE=%s/probe-home

        XDG_CONFIG_HOME=%s/probe-home/.config

        '' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        name=$(printf ''%s'' "$REVIEW_CASE" | jq -r .artifact)

        repository=$(printf ''%s'' "$REVIEW_CASE" | jq -r .repository)

        sha=$(printf ''%s'' "$REVIEW_CASE" | jq -r .target_sha)

        gh run download 34101652351 -R anirudhsengar/agentify -n "$name" -D "$RUNNER_TEMP/previous"

        git init -q "$RUNNER_TEMP/probe-target"

        git -C "$RUNNER_TEMP/probe-target" fetch --depth=1 "https://github.com/$repository.git" "$sha"

        git -C "$RUNNER_TEMP/probe-target" checkout --detach -q FETCH_HEAD

        mkdir -p "$RUNNER_TEMP/probe-home"

        '
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: probe-code
        persist-credentials: false
    - name: Run bounded production review with explicit verdicts
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        REVIEW_CASE: ${{ toJSON(matrix.case) }}
      run: node --import tsx probe-code/.github/qualification/review-probe.mjs
    - name: Retain redacted review outcome only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: explicit-verdict-${{ matrix.case.name }}-${{ github.run_id }}
        path: ${{ env.PROBE_EVIDENCE }}
        if-no-files-found: warn
        retention-days: 14
    - name: Remove disposable inputs and authentication
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/probe-home" "$RUNNER_TEMP/probe-target" "$RUNNER_TEMP/previous"
