name: Qualify portfolio closure fix

on:
  push:
    branches: [fix/portfolio-closure-command-contracts]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qualify-portfolio-closure-fix
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'remove portfolio implementation staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require applied implementation
        run: |
          grep -q 'uncovered_clusters' src/core/audit/specialist-completion.ts
          grep -Eq 'executable.*command|command.*executable' src/core/specialists/discovery.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run test:parity
      - run: npm run test:package
      - run: npm run verify:scaffold
      - run: npm audit --audit-level=high
      - name: Record successful qualification and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 5 --repo anirudhsengar/agentify --body "Exact branch qualification passed: typecheck, complete source suite, CLI parity, packed-package qualification, scaffold verification, and dependency audit on Node 22.19.0."
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          rm -f .github/workflows/qualify-portfolio-fix.yml
          git add -A
          git commit -m "ci: remove one-shot portfolio qualification workflow"
          git push origin HEAD:fix/portfolio-closure-command-contracts
      - name: Report qualification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 5 --repo anirudhsengar/agentify --body "Portfolio-fix qualification failed. Inspect ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} before merging."
