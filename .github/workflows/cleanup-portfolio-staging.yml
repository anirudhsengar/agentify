name: Cleanup portfolio implementation staging

on:
  push:
    branches: [fix/portfolio-closure-command-contracts]

permissions:
  contents: write

concurrency:
  group: cleanup-portfolio-implementation-staging
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Remove one-shot staging only after implementation is present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'uncovered_clusters' src/core/audit/specialist-completion.ts || exit 0
          grep -Eq 'executable.*command|command.*executable' src/core/specialists/discovery.ts || exit 0

          base=b5bdc72fb36feb17ddf94b4b568312411a77625f
          rm -f \
            .github/workflows/apply-portfolio-fix.yml \
            .github/workflows/open-portfolio-fix-pr.yml \
            .github/workflows/cleanup-portfolio-staging.yml

          while IFS= read -r candidate; do
            [[ -f "$candidate" ]] || continue
            [[ $(stat -c %s "$candidate") -le 8000000 ]] || continue
            decoded="$(mktemp)"
            if base64 --decode "$candidate" > "$decoded" 2>/dev/null && grep -q '^diff --git ' "$decoded"; then
              rm -f "$candidate"
            fi
            rm -f "$decoded"
          done < <(git diff --name-only "$base"..HEAD)

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Anirudh Sengar"
          git config user.email "111981402+anirudhsengar@users.noreply.github.com"
          git diff --cached --check
          git commit -m "ci: remove portfolio implementation staging"
          git push origin HEAD:fix/portfolio-closure-command-contracts
