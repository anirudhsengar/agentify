name: release-publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    outputs:
      tarball-filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Pin release packaging npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"
      - name: Complete release verification
        run: npm run verify:release
      - name: Build release tarball
        id: pack
        shell: bash
        run: |
          pack_result_path="${RUNNER_TEMP}/pack-result.json"
          npm run --silent pack:release > "$pack_result_path"

          filename="$(
            PACK_RESULT_PATH="$pack_result_path" node --input-type=module --eval '
              import fs from "node:fs";
              const result = JSON.parse(fs.readFileSync(process.env.PACK_RESULT_PATH, "utf8"));
              const filename = result?.filename;
              if (typeof filename !== "string" || filename.trim() === "") {
                throw new Error("pack:release result did not include a non-empty filename");
              }
              process.stdout.write(filename);
            '
          )"

          if [[ ! -f "$filename" ]]; then
            echo "Packed tarball does not exist: $filename" >&2
            exit 1
          fi

          printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"
      - name: Upload verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish verified tarball to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@anirudhsengar/agentify
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pin release publishing npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-${{ github.run_id }}
          path: release-artifact
      - name: Publish exact verified artifact
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(./release-artifact/*.tgz)

          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected exactly one release tarball, found ${#tarballs[@]}" >&2
            printf '%s\n' "${tarballs[@]}" >&2
            exit 1
          fi

          npm_tag=latest
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm_tag=next
          fi

          if ! npm publish "${tarballs[0]}" --provenance --access public --tag "$npm_tag"; then
            debug_logs=("$HOME"/.npm/_logs/*-debug-0.log)
            if (( ${#debug_logs[@]} > 0 )); then
              latest_debug_log="${debug_logs[${#debug_logs[@]} - 1]}"
              grep -E ' (verbose|silly) oidc ' "$latest_debug_log" >&2 || true
            fi
            exit 1
          fi

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-${{ github.run_id }}
          path: release-artifact
      - name: Resolve exact verified artifact
        id: release-artifact
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(./release-artifact/*.tgz)

          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected exactly one release tarball, found ${#tarballs[@]}" >&2
            printf '%s\n' "${tarballs[@]}" >&2
            exit 1
          fi

          printf 'path=%s\n' "${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish release with verified artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.release-artifact.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
