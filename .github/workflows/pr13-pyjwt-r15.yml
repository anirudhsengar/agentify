        \ > \"$RUNNER_TEMP/qualification.json\"\nfor version in 22.19.0 24.19.0; do\n gh run download 34255071445\
        \ -R anirudhsengar/agentify -n \"pr13-compound-r15-code-node-$version-34255071445\" -D \"$RUNNER_TEMP/qualified-source/node-$version\"\
        \ndone\nfor name in r15-1-high-jwk r15-1-high-valid-cache r15-1-numeric-exp-canary r15-2-high-jwk r15-2-high-valid-cache\
        \ r15-2-numeric-exp-canary; do\n gh run download \"$GITHUB_RUN_ID\" -R anirudhsengar/agentify -n \"review-r15-$name-$GITHUB_RUN_ID\"\
        \ -D \"$RUNNER_TEMP/source-controls/$name\"\ndone\nnode \"$RUNNER_TEMP/review-r15-validation/.github/qualification/verify-review-r15.mjs\"\
        \nprintf 'LIVE_WORK_DIR=%s/fresh-pyjwt-r15-%s\\nLIVE_PACK_RESULT=%s/pyjwt-r15-pack.json\\n' \"$RUNNER_TEMP\"\
        \ \"$GITHUB_RUN_ID\" \"$RUNNER_TEMP\" >> \"$GITHUB_ENV\"\n"
    - name: Validate exact-source evidence gate without model credentials
      run: node --test "$RUNNER_TEMP/review-r15-validation/.github/qualification/verify-review-r15.test.mjs"
    - name: Pack exact qualified bytes
      run: 'set -euo pipefail

        umask 022

        npm run --silent pack:release > "$LIVE_PACK_RESULT"

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.env.LIVE_PACK_RESULT,"utf8"));
        assert.equal(p.sha256,process.env.LIVE_EXPECTED_PACKAGE_HASH); console.log(JSON.stringify(p));''

        '
    - name: Prepare fresh frozen target and install actual npm artifact
      run: npm run --silent live:prepare
    - name: Validate source-checkpoint observer without model credentials
      run: node --test "$RUNNER_TEMP/review-r15-validation/.github/qualification/cancellation-events.test.mjs"
    - name: Interrupt the actual installed CLI at the validated checkpoint
      env:
        PI_API_KEY: ${{ secrets.PI_API_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: node "$RUNNER_TEMP/review-r15-validation/.github/qualification/cli-cancellation.mjs"
    - name: Retain redacted per-target evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cli-cancellation-r15-${{ github.run_id }}
        path: '${{ env.LIVE_WORK_DIR }}/evidence

          ${{ runner.temp }}/qualification.json

          ${{ runner.temp }}/review-r15-qualification-reuse.json'
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
    - name: Remove disposable target and credentials
      if: always()
      run: if test -n "${LIVE_WORK_DIR:-}"; then rm -rf -- "$LIVE_WORK_DIR"; fi
    needs:
    - review
