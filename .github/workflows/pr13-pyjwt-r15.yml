          candidate_tree: c0dfde8051bf0aad855136faf4d54e4f5fe649f5
          thinking_level: high
          false_claim_canary: true
          require_source_observation: true
    steps:
    - name: Require existing exact-code success before model use
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api repos/anirudhsengar/agentify/actions/runs/34255071445 --jq ''.status + " " + .conclusion + " " +
