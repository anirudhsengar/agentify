name: PR13 compound assertion review qualification
run-name: PR13 ecb1753 repeated compound checks, cancellation and fresh PyJWT
'on':
  push:
    branches:
    - validation/pr13-pyjwt-r15-20260908
    paths:
    - .github/workflows/pr13-pyjwt-r15.yml
    - .github/qualification/**
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-pyjwt-r15-20260908
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == github.repository_owner
    name: Review / ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - artifact: native-live-pyjwt-34196528837
          source_run: 34196528837
          map_sha256: ef196b102ee2e11935de68bbb776791bb8f0e7a895149b27955d8d10bf7489cd
          target_sha: 7144e4534c34810f4525dc4578a32addd8212cff
          repository: anirudhsengar/pyjwt
          name: r15-1-high-jwk
          concern: JWK and JWKSet parsing
