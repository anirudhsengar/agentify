name: PR13 source-first line-bound review qualification
run-name: PR13 0152e52 source-only observations, repeated controls, cancellation and fresh PyJWT
'on':
  push:
    branches:
    - validation/pr13-pyjwt-r13-20260908
    paths:
    - .github/workflows/pr13-pyjwt-r13.yml
    - .github/qualification/**
permissions:
  contents: read
  actions: read
concurrency:
  group: pr13-pyjwt-r13-20260908
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == github.repository_owner
