        \ndone\nfor name in r13-1-high-jwk r13-1-high-valid-cache r13-1-numeric-exp-canary r13-2-high-jwk r13-2-high-valid-cache\
        \ r13-2-numeric-exp-canary; do\n gh run download \"$GITHUB_RUN_ID\" -R anirudhsengar/agentify -n \"review-r13-$name-$GITHUB_RUN_ID\"\
        \ -D \"$RUNNER_TEMP/source-controls/$name\"\ndone\nnode \"$RUNNER_TEMP/review-r13-validation/.github/qualification/verify-review-r13.mjs\"\
        \nprintf 'LIVE_WORK_DIR=%s/fresh-pyjwt-r13-%s\\nLIVE_PACK_RESULT=%s/pyjwt-r13-pack.json\\n' \"$RUNNER_TEMP\"\
        \ \"$GITHUB_RUN_ID\" \"$RUNNER_TEMP\" >> \"$GITHUB_ENV\"\n"
    - name: Validate exact-source evidence gate without model credentials
      run: node --test "$RUNNER_TEMP/review-r13-validation/.github/qualification/verify-review-r13.test.mjs"
    - name: Pack exact qualified bytes
      run: 'set -euo pipefail

        umask 022

        npm run --silent pack:release > "$LIVE_PACK_RESULT"

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.env.LIVE_PACK_RESULT,"utf8"));
        assert.equal(p.sha256,process.env.LIVE_EXPECTED_PACKAGE_HASH); console.log(JSON.stringify(p));''

        '
    - name: Prepare fresh frozen target and install actual npm artifact
      run: npm run --silent live:prepare
    - name: Validate source-checkpoint observer without model credentials
      run: node --test "$RUNNER_TEMP/review-r13-validation/.github/qualification/cancellation-events.test.mjs"
    - name: Interrupt the actual installed CLI at the validated checkpoint
